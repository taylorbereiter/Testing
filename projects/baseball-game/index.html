<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#111c14" />
<title>Tap Ball ⚾</title>
<style>
:root {
  --grass: #2f7d32;
  --grass2: #276a2a;
  --dirt: #b9763f;
  --ink: #0d1b13;
  --line: rgba(255, 255, 255, 0.85);
  --accent: #ffd23f;
  --good: #6fe06f;
  --great: #ffd23f;
  --cpu: #ff7a6b;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

html,
body {
  margin: 0;
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #0b140d;
  color: #fff;
  overscroll-behavior: none;
}

#app {
  max-width: 520px;
  margin: 0 auto;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* Scoreboard ------------------------------------------------------------- */
#scoreboard {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 8px;
  padding: 12px 14px calc(12px + env(safe-area-inset-top));
  background: #111c14;
  border-bottom: 2px solid #0a120c;
}
.team {
  text-align: center;
}
.team .name {
  font-size: 12px;
  letter-spacing: 0.08em;
  opacity: 0.7;
}
.team .runs {
  font-size: 34px;
  font-weight: 800;
  line-height: 1;
}
#cs-wrap .runs {
  color: var(--cpu);
}
#ps-wrap .runs {
  color: var(--accent);
}
.center {
  text-align: center;
  min-width: 92px;
}
#inning {
  font-size: 18px;
  font-weight: 700;
}
#count {
  font-size: 13px;
  opacity: 0.8;
  margin-top: 2px;
}
#outs {
  display: flex;
  gap: 5px;
  justify-content: center;
  margin-top: 6px;
}
.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  border: 1.5px solid #fff6;
}
.dot.on {
  background: var(--cpu);
  border-color: var(--cpu);
}

/* Field ------------------------------------------------------------------ */
#field {
  position: relative;
  flex: 1;
  background:
    radial-gradient(120% 80% at 50% 110%, var(--dirt) 0 18%, transparent 18%),
    repeating-linear-gradient(
      var(--grass) 0 26px,
      var(--grass2) 26px 52px
    );
  overflow: hidden;
  touch-action: manipulation;
  cursor: pointer;
}

/* Bases diamond (top-left mini map) */
#bases {
  position: absolute;
  top: 12px;
  left: 12px;
  width: 58px;
  height: 58px;
  transform: rotate(45deg);
}
.base {
  position: absolute;
  width: 16px;
  height: 16px;
  background: #ffffff55;
  border: 1.5px solid #fff;
}
.base.on {
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
}
#base0 {
  right: 0;
  top: 21px;
} /* 1st */
#base1 {
  left: 21px;
  top: 0;
} /* 2nd */
#base2 {
  left: 0;
  top: 21px;
} /* 3rd */

/* Pitch track + plate */
#track {
  position: absolute;
  left: 50%;
  top: 4%;
  bottom: 4%;
  width: 4px;
  margin-left: -2px;
  background: linear-gradient(#ffffff22, #ffffff05);
}
#plate {
  position: absolute;
  left: 50%;
  top: 84%;
  width: 110px;
  height: 14px;
  margin-left: -55px;
  background: #fff;
  clip-path: polygon(0 0, 100% 0, 85% 100%, 15% 100%);
  opacity: 0.92;
}
#zone {
  position: absolute;
  left: 50%;
  top: calc(84% - 34px);
  width: 70px;
  height: 60px;
  margin-left: -35px;
  border: 2px dashed #ffffff55;
  border-radius: 4px;
}
.ball {
  position: absolute;
  left: 50%;
  top: 0;
  width: 26px;
  height: 26px;
  margin-left: -13px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff, #e8e3d6);
  box-shadow: 0 2px 8px #0007;
  opacity: 0;
}
.ball::after {
  content: "";
  position: absolute;
  inset: 4px;
  border-radius: 50%;
  border-top: 2px solid #d33;
  border-bottom: 2px solid #d33;
}
.ball.curve {
  background: radial-gradient(circle at 35% 30%, #fff, #d9e6ff);
}
.ball.changeup {
  background: radial-gradient(circle at 35% 30%, #fff, #ffe9d9);
}

#bat {
  position: absolute;
  left: 50%;
  top: 80%;
  width: 90px;
  height: 10px;
  margin-left: -10px;
  background: linear-gradient(90deg, #c08a4a, #e8b877);
  border-radius: 6px;
  transform-origin: left center;
  transform: rotate(35deg);
  opacity: 0;
}
#bat.swing {
  animation: swing 0.22s ease-out;
}
@keyframes swing {
  0% {
    opacity: 1;
    transform: rotate(35deg);
  }
  60% {
    opacity: 1;
    transform: rotate(-55deg);
  }
  100% {
    opacity: 0;
    transform: rotate(-70deg);
  }
}

/* Messaging -------------------------------------------------------------- */
#message {
  position: absolute;
  left: 0;
  right: 0;
  top: 38%;
  text-align: center;
  font-size: 30px;
  font-weight: 800;
  text-shadow: 0 2px 10px #000a;
  pointer-events: none;
  min-height: 36px;
}
.message.good {
  color: var(--good);
}
.message.great {
  color: var(--great);
  animation: pop 0.4s ease;
}
.message.cpu {
  color: var(--cpu);
}
@keyframes pop {
  0% {
    transform: scale(0.6);
  }
  70% {
    transform: scale(1.15);
  }
  100% {
    transform: scale(1);
  }
}
#prompt {
  position: absolute;
  left: 0;
  right: 0;
  bottom: calc(16px + env(safe-area-inset-bottom));
  text-align: center;
  font-size: 15px;
  opacity: 0.85;
  pointer-events: none;
  padding: 0 24px;
}

/* Final overlay ---------------------------------------------------------- */
#overlay {
  position: absolute;
  inset: 0;
  background: #0b140dee;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  z-index: 5;
}
#overlay.hidden {
  display: none;
}
#final-title {
  font-size: 30px;
  font-weight: 800;
}
#final-score {
  font-size: 50px;
  font-weight: 800;
  color: var(--accent);
}
#play-again {
  margin-top: 8px;
  padding: 14px 30px;
  font-size: 18px;
  font-weight: 700;
  color: #0b140d;
  background: var(--accent);
  border: none;
  border-radius: 999px;
}

</style>
</head>
<body>
<div id="app">
  <div id="scoreboard">
    <div class="team" id="ps-wrap"><div class="name">YOU</div><div class="runs" id="ps">0</div></div>
    <div class="center">
      <div id="inning">▲ 1/3</div>
      <div id="count">0-0</div>
      <div id="outs"></div>
    </div>
    <div class="team" id="cs-wrap"><div class="name">CPU</div><div class="runs" id="cs">0</div></div>
  </div>
  <div id="field">
    <div id="bases">
      <div class="base" id="base0"></div>
      <div class="base" id="base1"></div>
      <div class="base" id="base2"></div>
    </div>
    <div id="track"></div>
    <div id="zone"></div>
    <div id="plate"></div>
    <div class="ball" id="ball"></div>
    <div id="bat"></div>
    <div id="message" class="message"></div>
    <div id="prompt"></div>
  </div>
  <div id="overlay" class="hidden">
    <div id="final-title"></div>
    <div id="final-score"></div>
    <button id="play-again">Play again</button>
  </div>
</div>
<script>
// ---- Engine (identical to what the evals validated) ----
// Pure baseball game engine — no DOM, no globals.
// Works in the browser (via <script type="module">) and in Node (via import).
//
// Design goals:
//  - Deterministic given a seed, so evals are reproducible.
//  - A timing-based batting mechanic that is fun on a phone (one tap = one swing).
//  - Tunable constants (TUNING) so the self-improvement loop can adjust balance.

// ---------------------------------------------------------------------------
// Seedable RNG (mulberry32) — small, fast, deterministic.
// ---------------------------------------------------------------------------
function makeRng(seed) {
  let a = seed >>> 0;
  return function rng() {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------------------------------------------------------------------------
// Tuning — every "feel" number lives here so the loop can adjust balance
// without touching logic. Values are calibrated by evals/loop.
// ---------------------------------------------------------------------------
const TUNING = {
  innings: 3, // short sessions suit a phone
  pitchTravelMs: { fastball: 600, changeup: 820, curve: 700 },
  // Timing windows (ms of absolute error around ideal contact).
  perfectWindowMs: 45, // crushes it -> XBH/HR potential
  goodWindowMs: 110, // solid contact -> hit potential
  contactWindowMs: 190, // weak contact -> foul / out in play
  // How much a pitch's "stuff" shrinks the windows (harder pitches = tighter).
  pitchDifficulty: { fastball: 1.0, changeup: 1.15, curve: 1.25 },
  // Outcome probabilities given the quality of contact.
  outcomes: {
    perfect: { hr: 0.34, triple: 0.06, double: 0.26, single: 0.22, out: 0.12 },
    good: { hr: 0.08, triple: 0.04, double: 0.18, single: 0.40, out: 0.30 },
    weak: { hr: 0.0, triple: 0.0, double: 0.03, single: 0.15, out: 0.82 },
  },
  // Zone judgement: fraction of pitches that are actually in the strike zone.
  strikeZoneRate: 0.62,
  // CPU opponent strength (runs/inning is drawn around this).
  cpuRunsPerInningMean: 0.95,
  cpuRunsPerInningSpread: 1.4,
};

const PITCH_TYPES = ["fastball", "changeup", "curve"];

// ---------------------------------------------------------------------------
// Game state
// ---------------------------------------------------------------------------
function newGame({ seed = 1, tuning = TUNING } = {}) {
  return {
    tuning,
    rng: makeRng(seed),
    seed,
    inning: 1,
    half: "top", // player always bats in the "top"; CPU bats the bottom
    outs: 0,
    balls: 0,
    strikes: 0,
    bases: [false, false, false], // 1st, 2nd, 3rd occupied?
    score: { player: 0, cpu: 0 },
    log: [],
    currentPitch: null,
    over: false,
    pitchCount: 0,
    swings: 0,
    contacts: 0,
  };
}

// Throw the next pitch. Returns the pitch descriptor the UI animates.
function pitch(game) {
  if (game.over || game.half !== "top") return null;
  const t = game.tuning;
  const type = PITCH_TYPES[Math.floor(game.rng() * PITCH_TYPES.length)];
  const travelMs = t.pitchTravelMs[type];
  const inZone = game.rng() < t.strikeZoneRate;
  game.currentPitch = {
    type,
    travelMs,
    inZone,
    idealContactMs: travelMs, // contact is ideal right as it crosses the plate
    thrownAt: null,
  };
  game.pitchCount += 1;
  return game.currentPitch;
}

// Classify swing-timing error into a contact quality bucket.
function classifyContact(game, timingErrorMs) {
  const t = game.tuning;
  const diff = t.pitchDifficulty[game.currentPitch.type];
  const perfect = t.perfectWindowMs / diff;
  const good = t.goodWindowMs / diff;
  const contact = t.contactWindowMs / diff;
  const e = Math.abs(timingErrorMs);
  if (e <= perfect) return "perfect";
  if (e <= good) return "good";
  if (e <= contact) return "weak";
  return "miss";
}

function rollOutcome(game, quality) {
  const probs = game.tuning.outcomes[quality];
  const r = game.rng();
  let acc = 0;
  for (const k of ["hr", "triple", "double", "single", "out"]) {
    acc += probs[k] || 0;
    if (r < acc) return k;
  }
  return "out";
}

// Advance runners for a hit of the given number of bases (4 = HR).
function advanceRunners(game, basesToAdvance) {
  let runs = 0;
  // Process existing runners from 3rd -> 1st.
  const newBases = [false, false, false];
  // Batter starts at base index (basesToAdvance-1); 4 => scores.
  const runners = [];
  for (let b = 2; b >= 0; b--) {
    if (game.bases[b]) runners.push(b + 1); // distance from home
  }
  // Move each existing runner.
  for (const fromBase of runners) {
    const dest = fromBase + basesToAdvance; // distance from home in bases
    if (dest >= 4) runs += 1;
    else newBases[dest - 1] = true;
  }
  // Place the batter.
  if (basesToAdvance >= 4) runs += 1;
  else newBases[basesToAdvance - 1] = true;
  game.bases = newBases;
  return runs;
}

function resetCount(game) {
  game.balls = 0;
  game.strikes = 0;
}

function recordOut(game) {
  game.outs += 1;
  if (game.outs >= 3) endHalfInning(game);
}

// The core at-bat resolution given the player's swing decision.
//   action: { swing: boolean, timingErrorMs?: number }
// Returns a result descriptor for the UI.
function resolveSwing(game, action) {
  if (game.over || game.half !== "top" || !game.currentPitch)
    return { kind: "noop" };
  const pitch = game.currentPitch;
  let result;

  if (!action.swing) {
    // Took the pitch.
    if (pitch.inZone) {
      game.strikes += 1;
      result = { kind: "called-strike" };
    } else {
      game.balls += 1;
      result = { kind: "ball" };
    }
  } else {
    game.swings += 1;
    const quality = classifyContact(game, action.timingErrorMs ?? 9999);
    if (quality === "miss") {
      game.strikes += 1;
      result = { kind: "swing-strike" };
    } else {
      game.contacts += 1;
      const outcome = rollOutcome(game, quality);
      if (outcome === "out") {
        recordOut(game);
        result = { kind: "out-in-play", quality };
        resetCount(game);
        game.currentPitch = null;
        return finalize(game, result);
      }
      const basesMap = { single: 1, double: 2, triple: 3, hr: 4 };
      const runs = advanceRunners(game, basesMap[outcome]);
      game.score.player += runs;
      result = { kind: "hit", outcome, quality, runs };
      resetCount(game);
      game.currentPitch = null;
      return finalize(game, result);
    }
  }

  // Resolve count-based terminal states.
  if (game.strikes >= 3) {
    recordOut(game);
    result = { ...result, terminal: "strikeout" };
    resetCount(game);
  } else if (game.balls >= 4) {
    const runs = advanceRunners(game, 1); // walk forces runners
    game.score.player += runs;
    result = { ...result, terminal: "walk", runs };
    resetCount(game);
  }
  game.currentPitch = null;
  return finalize(game, result);
}

function finalize(game, result) {
  game.log.push({
    inning: game.inning,
    half: game.half,
    ...result,
    score: { ...game.score },
  });
  return result;
}

// CPU bats the bottom of the inning via a simple run model, then we advance.
function playCpuHalf(game) {
  const t = game.tuning;
  // Draw runs from a clamped normal-ish distribution.
  const g = (game.rng() + game.rng() + game.rng()) / 3; // ~normal in [0,1]
  const runs = Math.max(
    0,
    Math.round(
      t.cpuRunsPerInningMean + (g - 0.5) * 2 * t.cpuRunsPerInningSpread,
    ),
  );
  game.score.cpu += runs;
  game.log.push({ inning: game.inning, half: "bottom", kind: "cpu", runs });
  // Walk-off: if CPU takes the lead in the final inning, game ends.
  if (
    game.inning >= t.innings &&
    game.score.cpu > game.score.player
  ) {
    game.over = true;
  }
  game.inning += 1;
  game.half = "top";
  game.outs = 0;
  game.bases = [false, false, false];
  resetCount(game);
  if (game.inning > t.innings && !game.over) game.over = true;
  return runs;
}

function endHalfInning(game) {
  // Player's half just ended; hand off to the CPU.
  game.outs = 0;
  game.bases = [false, false, false];
  resetCount(game);
  game.half = "bottom";
  // Final-inning early-out: if player is already trailing badly it still plays
  // the bottom for drama; CPU half is triggered by the driver/UI.
}

// Convenience: is it the CPU's turn to bat?
function cpuToBat(game) {
  return !game.over && game.half === "bottom";
}

function winner(game) {
  if (!game.over) return null;
  if (game.score.player > game.score.cpu) return "player";
  if (game.score.cpu > game.score.player) return "cpu";
  return "tie";
}

// ---- Tuned configuration (from the self-improvement loop) ----
const TUNED = {
  "innings": 3,
  "pitchTravelMs": {
    "fastball": 600,
    "changeup": 820,
    "curve": 700
  },
  "perfectWindowMs": 55.77130510702404,
  "goodWindowMs": 97.08925259276293,
  "contactWindowMs": 150,
  "pitchDifficulty": {
    "fastball": 1,
    "changeup": 1.15,
    "curve": 1.25
  },
  "outcomes": {
    "perfect": {
      "hr": 0.22447917154490446,
      "triple": 0.056767079695517815,
      "double": 0.24599067868057722,
      "single": 0.20814595888356524,
      "out": 0.2646171111954353
    },
    "good": {
      "hr": 0.07729950353590115,
      "triple": 0.038649751767950574,
      "double": 0.17392388295577746,
      "single": 0.4208273271716406,
      "out": 0.28929953456873025
    },
    "weak": {
      "hr": 0,
      "triple": 0,
      "double": 0.02964194899782678,
      "single": 0.1482097449891339,
      "out": 0.8221483060130393
    }
  },
  "strikeZoneRate": 0.5748652552756481,
  "cpuRunsPerInningMean": 2.1879044548897073,
  "cpuRunsPerInningSpread": 0.9148324684366584
} || TUNING;
// ---- UI ----
/* Browser UI for the baseball game. Assumes the engine functions and the
   TUNED config are already in scope (the build inlines them). Pure DOM + rAF,
   no dependencies, designed thumb-first for phones: tap anywhere to swing. */

(function () {
  const $ = (id) => document.getElementById(id);
  const PLATE_Y = 84; // % down the track where the ball crosses the plate
  let game = null;
  let pitchState = null; // { startTs, travelMs, idealMs, swung, raf }

  function start() {
    game = newGame({ seed: (Math.random() * 1e9) | 0, tuning: TUNED });
    renderBoard();
    setMessage("Play ball!", "");
    setPrompt("Tap anywhere to take your first pitch");
    $("ball").style.opacity = "0";
    $("overlay").classList.add("hidden");
    armForPitch();
  }

  // Wait for the user to initiate the next pitch.
  function armForPitch() {
    if (game.over) return showFinal();
    if (cpuToBat(game)) return runCpuHalf();
    setPrompt("Tap to throw — then tap again to SWING");
    field().onpointerdown = throwPitch;
  }

  function throwPitch() {
    if (game.over || cpuToBat(game)) return;
    const p = pitch(game);
    if (!p) return;
    setMessage("", "");
    const ball = $("ball");
    ball.style.opacity = "1";
    ball.className = "ball " + p.type;
    pitchState = {
      startTs: performance.now(),
      travelMs: p.travelMs,
      idealMs: p.idealContactMs,
      inZone: p.inZone,
      swung: false,
    };
    setPrompt(p.inZone ? "" : "");
    field().onpointerdown = swing; // next tap is the swing
    animate();
  }

  function animate() {
    const ps = pitchState;
    if (!ps) return;
    const elapsed = performance.now() - ps.startTs;
    const frac = elapsed / ps.travelMs;
    const y = frac * PLATE_Y;
    $("ball").style.top = Math.min(y, 100) + "%";
    // Lateral break for curve/changeup to make pitch type readable.
    const ball = $("ball");
    const breakAmt = ball.classList.contains("curve")
      ? Math.sin(frac * Math.PI) * 16
      : ball.classList.contains("changeup")
        ? Math.sin(frac * Math.PI) * -8
        : 0;
    ball.style.transform = `translateX(${breakAmt}px)`;

    // Grace period past the plate before it counts as "taken".
    if (elapsed >= ps.travelMs + 120) {
      if (!ps.swung) takePitch();
      return;
    }
    ps.raf = requestAnimationFrame(animate);
  }

  function swing() {
    const ps = pitchState;
    if (!ps || ps.swung) return;
    ps.swung = true;
    cancelAnimationFrame(ps.raf);
    const tapMs = performance.now() - ps.startTs;
    const timingErrorMs = tapMs - ps.idealMs;
    flashBat();
    const res = resolveSwing(game, { swing: true, timingErrorMs });
    finishPitch(res, timingErrorMs);
  }

  function takePitch() {
    const ps = pitchState;
    if (!ps || ps.swung) return;
    ps.swung = true;
    const res = resolveSwing(game, { swing: false });
    finishPitch(res, null);
  }

  function finishPitch(res, timingErrorMs) {
    pitchState = null;
    $("ball").style.opacity = "0";
    describe(res, timingErrorMs);
    renderBoard();
    field().onpointerdown = null;
    setTimeout(() => {
      if (game.over) showFinal();
      else armForPitch();
    }, res.kind === "hit" || res.terminal ? 950 : 600);
  }

  function runCpuHalf() {
    setPrompt("");
    setMessage(`Bottom ${game.inning} — opponent batting…`, "cpu");
    setTimeout(() => {
      const runs = playCpuHalf(game);
      setMessage(
        runs === 0 ? "Opponent retired in order!" : `Opponent scores ${runs}!`,
        runs === 0 ? "good" : "cpu",
      );
      renderBoard();
      setTimeout(() => (game.over ? showFinal() : armForPitch()), 1100);
    }, 900);
  }

  // --- Rendering -----------------------------------------------------------
  function renderBoard() {
    $("inning").textContent = `${game.half === "top" ? "▲" : "▼"} ${game.inning}/${TUNED.innings}`;
    $("ps").textContent = game.score.player;
    $("cs").textContent = game.score.cpu;
    $("outs").innerHTML = [0, 1, 2]
      .map((i) => `<span class="dot ${i < game.outs ? "on" : ""}"></span>`)
      .join("");
    $("count").textContent = `${game.balls}-${game.strikes}`;
    for (let b = 0; b < 3; b++)
      $("base" + b).classList.toggle("on", game.bases[b]);
  }

  function describe(res, err) {
    if (!res || res.kind === "noop") return;
    const labels = {
      single: ["SINGLE!", "good"],
      double: ["DOUBLE!", "good"],
      triple: ["TRIPLE!", "good"],
      hr: ["💥 HOME RUN! 💥", "great"],
    };
    let text, cls;
    if (res.kind === "hit") {
      [text, cls] = labels[res.outcome];
      if (res.runs) text += ` (+${res.runs})`;
    } else if (res.kind === "out-in-play") {
      text = res.quality === "weak" ? "Weak grounder — out" : "Caught — out";
      cls = "cpu";
    } else if (res.kind === "swing-strike") {
      text = timingHint(err, "Swing and a miss");
      cls = "cpu";
    } else if (res.kind === "called-strike") {
      text = "Called strike";
      cls = "cpu";
    } else if (res.kind === "ball") {
      text = "Ball";
      cls = "";
    }
    if (res.terminal === "strikeout") (text = "STRUCK OUT"), (cls = "cpu");
    if (res.terminal === "walk")
      (text = "Walk" + (res.runs ? ` (+${res.runs})` : "")), (cls = "good");
    setMessage(text, cls);
  }

  function timingHint(err, base) {
    if (err == null) return base;
    if (err > 60) return base + " — late";
    if (err < -60) return base + " — early";
    return base + " — just off";
  }

  function showFinal() {
    const w = winner(game);
    const o = $("overlay");
    o.classList.remove("hidden");
    $("final-title").textContent =
      w === "player" ? "🏆 You win!" : w === "cpu" ? "Opponent wins" : "Tie game";
    $("final-score").textContent = `${game.score.player} – ${game.score.cpu}`;
  }

  // --- Helpers -------------------------------------------------------------
  const field = () => $("field");
  function setMessage(t, cls) {
    const m = $("message");
    m.textContent = t;
    m.className = "message " + (cls || "");
  }
  function setPrompt(t) {
    $("prompt").textContent = t;
  }
  function flashBat() {
    const b = $("bat");
    b.classList.remove("swing");
    void b.offsetWidth;
    b.classList.add("swing");
  }

  window.addEventListener("DOMContentLoaded", () => {
    $("play-again").onclick = start;
    start();
  });
})();

</script>
</body>
</html>
