<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12042e">
<title>NEON VOXEL ASSAULT</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #12042e;
    touch-action: none;
    overscroll-behavior: none;
    position: fixed;
    font-family: "Courier New", ui-monospace, monospace;
    -webkit-user-select: none; user-select: none;
  }
  canvas { display: block; }

  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

  .neon-cyan    { color: #2de2e6; text-shadow: 0 0 8px #2de2e6, 0 0 20px rgba(45,226,230,.6); }
  .neon-magenta { color: #f706cf; text-shadow: 0 0 8px #f706cf, 0 0 20px rgba(247,6,207,.6); }
  .neon-yellow  { color: #f9c80e; text-shadow: 0 0 8px #f9c80e, 0 0 20px rgba(249,200,14,.6); }

  #topbar {
    position: absolute;
    top: max(10px, env(safe-area-inset-top));
    left: max(14px, env(safe-area-inset-left));
    right: max(14px, env(safe-area-inset-right));
    display: flex; justify-content: space-between; align-items: flex-start;
    font-weight: bold; letter-spacing: 2px; font-size: 15px;
  }
  #hpwrap {
    width: 42vw; max-width: 240px;
  }
  #hplabel { font-size: 10px; letter-spacing: 3px; margin-bottom: 4px; }
  #hpbar {
    height: 10px; border: 1px solid #2de2e6; border-radius: 2px;
    box-shadow: 0 0 10px rgba(45,226,230,.5), inset 0 0 6px rgba(45,226,230,.3);
    overflow: hidden;
  }
  #hpfill {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #2de2e6, #36f9c5);
    box-shadow: 0 0 12px #2de2e6;
    transition: width .15s ease-out;
  }
  #scorebox { text-align: right; }
  #score { font-size: 22px; }
  #wave  { font-size: 11px; letter-spacing: 3px; margin-top: 3px; }

  #crosshair {
    position: absolute; left: 50%; top: 50%;
    width: 26px; height: 26px;
    transform: translate(-50%, -50%);
  }
  #crosshair::before, #crosshair::after {
    content: ""; position: absolute; background: #2de2e6;
    box-shadow: 0 0 6px #2de2e6;
  }
  #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; margin-left: -1px;
    clip-path: polygon(0 0, 100% 0, 100% 32%, 0 32%, 0 68%, 100% 68%, 100% 100%, 0 100%); }
  #crosshair::after  { top: 50%; left: 0; height: 2px; width: 100%; margin-top: -1px;
    clip-path: polygon(0 0, 32% 0, 32% 100%, 0 100%, 68% 0, 100% 0, 100% 100%, 68% 100%); }

  #stick {
    position: absolute; width: 110px; height: 110px;
    border: 2px solid rgba(45,226,230,.5); border-radius: 50%;
    box-shadow: 0 0 14px rgba(45,226,230,.35), inset 0 0 14px rgba(45,226,230,.15);
    display: none; transform: translate(-50%, -50%);
  }
  #knob {
    position: absolute; left: 50%; top: 50%; width: 48px; height: 48px;
    border-radius: 50%; background: rgba(45,226,230,.35);
    border: 2px solid #2de2e6; box-shadow: 0 0 16px #2de2e6;
    transform: translate(-50%, -50%);
  }

  #firebtn {
    position: fixed;
    right: max(22px, calc(env(safe-area-inset-right) + 10px));
    bottom: max(34px, calc(env(safe-area-inset-bottom) + 18px));
    width: 92px; height: 92px; border-radius: 50%;
    border: 2px solid #f706cf;
    background: radial-gradient(circle at 35% 30%, rgba(247,6,207,.45), rgba(247,6,207,.12));
    box-shadow: 0 0 22px rgba(247,6,207,.55), inset 0 0 18px rgba(247,6,207,.25);
    color: #f706cf; font-weight: bold; font-size: 13px; letter-spacing: 2px;
    text-shadow: 0 0 8px #f706cf;
    z-index: 20; pointer-events: auto;
    display: flex; align-items: center; justify-content: center;
    font-family: inherit;
  }
  #firebtn.pressed {
    background: radial-gradient(circle at 35% 30%, rgba(247,6,207,.8), rgba(247,6,207,.3));
    box-shadow: 0 0 34px #f706cf, inset 0 0 24px rgba(247,6,207,.5);
  }

  #vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(18,4,46,.55) 100%);
  }
  #damage {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, rgba(247,6,80,.0) 40%, rgba(247,6,80,.55) 100%);
    opacity: 0; transition: opacity .35s;
  }

  #banner {
    position: absolute; left: 0; right: 0; top: 34%;
    text-align: center; font-size: 30px; font-weight: bold; letter-spacing: 8px;
    opacity: 0; transition: opacity .3s;
  }

  .overlay {
    position: fixed; inset: 0; z-index: 30;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(10, 2, 28, .82);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    text-align: center; padding: 24px;
  }
  .overlay h1 {
    font-size: clamp(34px, 9vw, 56px); letter-spacing: 6px; line-height: 1.15;
    margin-bottom: 14px;
  }
  .overlay p { font-size: 14px; letter-spacing: 2px; line-height: 1.9; margin-bottom: 26px; }
  .overlay .bigbtn {
    pointer-events: auto;
    font-family: inherit; font-size: 18px; font-weight: bold; letter-spacing: 4px;
    padding: 16px 44px; border-radius: 6px;
    color: #f9c80e; border: 2px solid #f9c80e; background: rgba(249,200,14,.08);
    box-shadow: 0 0 22px rgba(249,200,14,.45), inset 0 0 14px rgba(249,200,14,.15);
    text-shadow: 0 0 10px #f9c80e;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 50% { transform: scale(1.05); } }
  #gameover { display: none; }
  #finalscore { font-size: 26px; margin-bottom: 24px; }
</style>
</head>
<body>

<div id="hud">
  <div id="vignette"></div>
  <div id="damage"></div>
  <div id="topbar">
    <div id="hpwrap">
      <div id="hplabel" class="neon-cyan">INTEGRITY</div>
      <div id="hpbar"><div id="hpfill"></div></div>
    </div>
    <div id="scorebox">
      <div id="score" class="neon-yellow">0</div>
      <div id="wave" class="neon-magenta">WAVE 1</div>
    </div>
  </div>
  <div id="crosshair"></div>
  <div id="banner" class="neon-magenta"></div>
  <div id="stick"><div id="knob"></div></div>
</div>

<button id="firebtn">FIRE</button>

<div class="overlay" id="start">
  <h1 class="neon-magenta">NEON VOXEL<br>ASSAULT</h1>
  <p class="neon-cyan">
    LEFT THUMB &mdash; MOVE<br>
    RIGHT THUMB &mdash; AIM<br>
    HOLD FIRE &mdash; SHOOT<br>
    DESTROY THE DRONES
  </p>
  <button class="bigbtn" id="startbtn">TAP TO DEPLOY</button>
</div>

<div class="overlay" id="gameover">
  <h1 class="neon-magenta">SIGNAL LOST</h1>
  <div id="finalscore" class="neon-yellow"></div>
  <button class="bigbtn" id="restartbtn">REDEPLOY</button>
</div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

/* ============================== CORE SETUP ============================== */

const PALETTE = {
  bg: 0x12042e, fog: 0x1c0640,
  cyan: 0x2de2e6, magenta: 0xf706cf, yellow: 0xf9c80e,
  purple: 0x3d1e6d, deep: 0x2a1052,
};

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(PALETTE.bg);
scene.fog = new THREE.Fog(PALETTE.fog, 18, 80);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 300);

scene.add(new THREE.HemisphereLight(0x8a5cff, 0x180735, 1.1));
const dirLight = new THREE.DirectionalLight(0xff9af5, 0.9);
dirLight.position.set(-20, 40, 10);
scene.add(dirLight);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ============================== WORLD ============================== */

const ARENA = 31;          // half-size of arena in voxels
const blocked = new Map(); // "x,z" -> column height

function cellKey(x, z) { return x + ',' + z; }
function isBlocked(x, z) {
  return Math.abs(x) > ARENA - 1 || Math.abs(z) > ARENA - 1 || blocked.has(cellKey(x, z));
}

// deterministic rng so the arena is always the same cool layout
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(1313);

// neon grid floor
function makeGridTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#1b0a3e'; g.fillRect(0, 0, 128, 128);
  g.strokeStyle = '#5a2ea6'; g.lineWidth = 3;
  g.strokeRect(0, 0, 128, 128);
  g.strokeStyle = 'rgba(45,226,230,0.85)'; g.lineWidth = 2;
  g.strokeRect(1, 1, 126, 126);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(ARENA * 2, ARENA * 2);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(ARENA * 2, ARENA * 2),
  new THREE.MeshBasicMaterial({ map: makeGridTexture() })
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

// giant synthwave sun on the horizon
function makeSun() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, '#f9c80e');
  grad.addColorStop(0.55, '#f706cf');
  grad.addColorStop(1, '#7a0fd4');
  g.fillStyle = grad;
  g.beginPath(); g.arc(128, 128, 124, 0, Math.PI * 2); g.fill();
  g.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 6; i++) g.fillRect(0, 150 + i * 16, 256, 4 + i * 1.5);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(70, 70),
    new THREE.MeshBasicMaterial({ map: t, transparent: true, fog: false, depthWrite: false })
  );
  m.position.set(0, 24, -160);
  return m;
}
scene.add(makeSun());

// scatter glowing star cubes in the sky
{
  const starGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
  const starMat = new THREE.MeshBasicMaterial({ color: PALETTE.cyan, fog: false });
  const stars = new THREE.InstancedMesh(starGeo, starMat, 120);
  const m4 = new THREE.Matrix4();
  for (let i = 0; i < 120; i++) {
    const a = rng() * Math.PI * 2, r = 90 + rng() * 80;
    m4.setPosition(Math.cos(a) * r, 18 + rng() * 60, Math.sin(a) * r);
    stars.setMatrixAt(i, m4);
  }
  scene.add(stars);
}

// voxel structures: dark towers with neon accent blocks
function buildArena() {
  const voxGeo = new THREE.BoxGeometry(1, 1, 1);
  const darkMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
  const glowMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const dark = [], glow = []; // {x,y,z,color}
  const darkColors = [PALETTE.purple, PALETTE.deep, 0x4b2585, 0x331260];
  const glowColors = [PALETTE.cyan, PALETTE.magenta, PALETTE.yellow];

  function column(x, z, h) {
    if (Math.abs(x) < 4 && Math.abs(z) < 4) return; // keep spawn clear
    blocked.set(cellKey(x, z), h);
    for (let y = 0; y < h; y++) {
      const neon = rng() < 0.12 || y === h - 1 && rng() < 0.45;
      const list = neon ? glow : dark;
      const colors = neon ? glowColors : darkColors;
      list.push({ x, y: y + 0.5, z, color: colors[(colors.length * rng()) | 0] });
    }
  }

  // perimeter wall
  for (let i = -ARENA; i <= ARENA; i++) {
    const h = 3 + ((rng() * 3) | 0);
    column(i, -ARENA, h); column(i, ARENA, h);
    column(-ARENA, i, h); column(ARENA, i, h);
  }
  // towers
  for (let n = 0; n < 26; n++) {
    const cx = ((rng() * 2 - 1) * (ARENA - 5)) | 0;
    const cz = ((rng() * 2 - 1) * (ARENA - 5)) | 0;
    const w = 1 + ((rng() * 2) | 0), d = 1 + ((rng() * 2) | 0);
    const h = 2 + ((rng() * 6) | 0);
    for (let dx = 0; dx < w; dx++)
      for (let dz = 0; dz < d; dz++)
        column(cx + dx, cz + dz, h + ((rng() * 2) | 0));
  }
  // low cover blocks
  for (let n = 0; n < 30; n++) {
    const cx = ((rng() * 2 - 1) * (ARENA - 4)) | 0;
    const cz = ((rng() * 2 - 1) * (ARENA - 4)) | 0;
    if (!blocked.has(cellKey(cx, cz))) column(cx, cz, 1 + ((rng() * 2) | 0));
  }

  for (const [list, mat] of [[dark, darkMat], [glow, glowMat]]) {
    const mesh = new THREE.InstancedMesh(voxGeo, mat, list.length);
    const m4 = new THREE.Matrix4(); const col = new THREE.Color();
    list.forEach((v, i) => {
      m4.setPosition(v.x, v.y, v.z);
      mesh.setMatrixAt(i, m4);
      mesh.setColorAt(i, col.setHex(v.color));
    });
    mesh.instanceMatrix.needsUpdate = true;
    scene.add(mesh);
  }
}
buildArena();

/* ============================== AUDIO ============================== */

let actx = null;
function audioInit() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
}
function blip(freq, dur, type, vol, slide) {
  if (!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(actx.destination);
  o.start(t); o.stop(t + dur);
}
const sfx = {
  shoot: () => blip(880, 0.09, 'square', 0.12, 0.4),
  hit:   () => blip(220, 0.08, 'sawtooth', 0.15, 0.6),
  boom:  () => { blip(110, 0.4, 'sawtooth', 0.25, 0.25); blip(55, 0.5, 'triangle', 0.3, 0.4); },
  hurt:  () => blip(160, 0.25, 'square', 0.2, 0.5),
  wave:  () => { blip(440, 0.15, 'square', 0.12); setTimeout(() => blip(660, 0.2, 'square', 0.12), 130); },
};

/* ============================== PLAYER ============================== */

const player = {
  pos: new THREE.Vector3(0, 1.6, 0),
  yaw: 0, pitch: 0,
  hp: 100, alive: true,
  radius: 0.35,
  fireCooldown: 0,
  recoil: 0, shake: 0,
};

function tryMove(dx, dz) {
  const r = player.radius;
  const nx = player.pos.x + dx;
  if (!isBlocked(Math.round(nx + Math.sign(dx) * r), Math.round(player.pos.z)) &&
      !isBlocked(Math.round(nx), Math.round(player.pos.z + r)) &&
      !isBlocked(Math.round(nx), Math.round(player.pos.z - r)))
    player.pos.x = nx;
  const nz = player.pos.z + dz;
  if (!isBlocked(Math.round(player.pos.x), Math.round(nz + Math.sign(dz) * r)) &&
      !isBlocked(Math.round(player.pos.x + r), Math.round(nz)) &&
      !isBlocked(Math.round(player.pos.x - r), Math.round(nz)))
    player.pos.z = nz;
}

/* ============================== BOTS ============================== */

const bots = [];
const botBodyGeo = new THREE.BoxGeometry(1, 0.9, 0.7);
const botHeadGeo = new THREE.BoxGeometry(0.6, 0.5, 0.6);
const botFinGeo  = new THREE.BoxGeometry(0.18, 0.6, 0.5);
const botEyeGeo  = new THREE.BoxGeometry(0.34, 0.12, 0.05);

function makeBot(variant) {
  const tint = variant === 0 ? PALETTE.magenta : variant === 1 ? PALETTE.cyan : PALETTE.yellow;
  const bodyMat = new THREE.MeshLambertMaterial({ color: 0x241048 });
  const glowMat = new THREE.MeshBasicMaterial({ color: tint });
  const g = new THREE.Group();
  const body = new THREE.Mesh(botBodyGeo, bodyMat); g.add(body);
  const head = new THREE.Mesh(botHeadGeo, bodyMat); head.position.y = 0.7; g.add(head);
  const eye = new THREE.Mesh(botEyeGeo, glowMat); eye.position.set(0, 0.7, 0.31); g.add(eye);
  const finL = new THREE.Mesh(botFinGeo, glowMat); finL.position.set(-0.6, 0, 0); g.add(finL);
  const finR = new THREE.Mesh(botFinGeo, glowMat); finR.position.set(0.6, 0, 0); g.add(finR);
  scene.add(g);
  return {
    group: g, bodyMat, tint,
    hp: 50 + wave * 8,
    pos: new THREE.Vector3(), hover: 1.4 + Math.random() * 0.8,
    phase: Math.random() * Math.PI * 2,
    orbitDir: Math.random() < 0.5 ? 1 : -1,
    standoff: 7 + Math.random() * 7,
    shootTimer: 1 + Math.random() * 2,
    flash: 0, alive: true,
  };
}

function spawnBot() {
  const bot = makeBot((Math.random() * 3) | 0);
  // spawn near a random edge, away from the player, on a free cell
  bot.pos.set(ARENA - 4, bot.hover, 0); // fallback if every try below misses
  for (let tries = 0; tries < 40; tries++) {
    const a = Math.random() * Math.PI * 2;
    const r = ARENA - 4 - Math.random() * 6;
    const x = Math.round(Math.cos(a) * r), z = Math.round(Math.sin(a) * r);
    if (!isBlocked(x, z) && Math.hypot(x - player.pos.x, z - player.pos.z) > 16) {
      bot.pos.set(x, bot.hover, z);
      break;
    }
  }
  bot.group.position.copy(bot.pos);
  bots.push(bot);
}

function hasLOS(from, to) {
  const steps = Math.ceil(from.distanceTo(to));
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    const x = Math.round(from.x + (to.x - from.x) * t);
    const z = Math.round(from.z + (to.z - from.z) * t);
    const y = from.y + (to.y - from.y) * t;
    const h = blocked.get(cellKey(x, z));
    if (h !== undefined && y < h) return false;
  }
  return true;
}

/* ============================== PROJECTILES & FX ============================== */

const MAXP = 64;
function makePool(geo, color, size) {
  const mesh = new THREE.InstancedMesh(geo, new THREE.MeshBasicMaterial({ color }), MAXP);
  mesh.frustumCulled = false;
  scene.add(mesh);
  const items = Array.from({ length: MAXP }, () => ({
    active: false, pos: new THREE.Vector3(), vel: new THREE.Vector3(), life: 0,
  }));
  const hidden = new THREE.Matrix4().makeScale(0, 0, 0);
  const m4 = new THREE.Matrix4();
  const quat = new THREE.Quaternion();
  const scale = new THREE.Vector3(size, size, size);
  const zAxis = new THREE.Vector3(0, 0, 1);
  const dir = new THREE.Vector3();
  return {
    mesh, items,
    fire(pos, vel, life) {
      const p = items.find(i => !i.active);
      if (!p) return null;
      p.active = true; p.pos.copy(pos); p.vel.copy(vel); p.life = life;
      return p;
    },
    render() {
      items.forEach((p, i) => {
        if (p.active) {
          quat.setFromUnitVectors(zAxis, dir.copy(p.vel).normalize());
          m4.compose(p.pos, quat, scale);
        } else m4.copy(hidden);
        mesh.setMatrixAt(i, m4);
      });
      mesh.instanceMatrix.needsUpdate = true;
    },
  };
}

const playerShots = makePool(new THREE.BoxGeometry(0.12, 0.12, 1.6), PALETTE.yellow, 1);
const botShots    = makePool(new THREE.BoxGeometry(0.3, 0.3, 0.3), PALETTE.magenta, 1);

// voxel debris explosions
const MAXD = 220;
const debrisMesh = new THREE.InstancedMesh(
  new THREE.BoxGeometry(0.22, 0.22, 0.22),
  new THREE.MeshBasicMaterial({ color: 0xffffff }), MAXD
);
debrisMesh.frustumCulled = false;
scene.add(debrisMesh);
const debris = Array.from({ length: MAXD }, () => ({
  active: false, pos: new THREE.Vector3(), vel: new THREE.Vector3(), life: 0, max: 1,
}));
const debrisColor = new THREE.Color();

function explode(pos, hexA, hexB, count) {
  let spawned = 0;
  for (const d of debris) {
    if (d.active) continue;
    d.active = true;
    d.pos.copy(pos);
    d.vel.set(Math.random() - 0.5, Math.random() * 0.9, Math.random() - 0.5).normalize()
      .multiplyScalar(3 + Math.random() * 7);
    d.max = d.life = 0.5 + Math.random() * 0.6;
    d.hex = Math.random() < 0.5 ? hexA : hexB;
    if (++spawned >= count) break;
  }
}

function updateDebris(dt) {
  const m4 = new THREE.Matrix4();
  debris.forEach((d, i) => {
    if (d.active) {
      d.life -= dt;
      if (d.life <= 0) d.active = false;
      d.vel.y -= 16 * dt;
      d.pos.addScaledVector(d.vel, dt);
      if (d.pos.y < 0.1) { d.pos.y = 0.1; d.vel.y *= -0.4; d.vel.x *= 0.8; d.vel.z *= 0.8; }
      const s = Math.max(0.01, d.life / d.max);
      m4.makeScale(s, s, s); m4.setPosition(d.pos);
      debrisMesh.setColorAt(i, debrisColor.setHex(d.hex || 0xffffff));
    } else {
      m4.makeScale(0, 0, 0);
    }
    debrisMesh.setMatrixAt(i, m4);
  });
  debrisMesh.instanceMatrix.needsUpdate = true;
  if (debrisMesh.instanceColor) debrisMesh.instanceColor.needsUpdate = true;
}

/* ============================== GAME STATE ============================== */

let wave = 0, score = 0, pendingSpawns = 0, spawnTimer = 0, waveDelay = 0;
let state = 'menu'; // menu | playing | dead

const ui = {
  hpfill: document.getElementById('hpfill'),
  score: document.getElementById('score'),
  wave: document.getElementById('wave'),
  banner: document.getElementById('banner'),
  damage: document.getElementById('damage'),
  start: document.getElementById('start'),
  gameover: document.getElementById('gameover'),
  finalscore: document.getElementById('finalscore'),
};

function showBanner(text) {
  ui.banner.textContent = text;
  ui.banner.style.opacity = 1;
  setTimeout(() => { ui.banner.style.opacity = 0; }, 1600);
}

function startWave() {
  wave++;
  pendingSpawns = 2 + wave * 2;
  spawnTimer = 0.5;
  ui.wave.textContent = 'WAVE ' + wave;
  showBanner('WAVE ' + wave);
  sfx.wave();
}

function resetGame() {
  for (const b of bots) scene.remove(b.group);
  bots.length = 0;
  for (const p of playerShots.items) p.active = false;
  for (const p of botShots.items) p.active = false;
  for (const d of debris) d.active = false;
  player.pos.set(0, 1.6, 0);
  player.yaw = 0; player.pitch = 0;
  player.hp = 100; player.alive = true;
  wave = 0; score = 0; pendingSpawns = 0; waveDelay = 0;
  ui.score.textContent = '0';
  ui.hpfill.style.width = '100%';
  startWave();
}

function damagePlayer(amount) {
  if (!player.alive) return;
  player.hp -= amount;
  player.shake = 0.35;
  ui.hpfill.style.width = Math.max(0, player.hp) + '%';
  ui.damage.style.opacity = 0.9;
  setTimeout(() => { ui.damage.style.opacity = 0; }, 120);
  sfx.hurt();
  if (navigator.vibrate) navigator.vibrate(40);
  if (player.hp <= 0) {
    player.alive = false;
    state = 'dead';
    ui.finalscore.textContent = 'SCORE ' + score + ' · WAVE ' + wave;
    ui.gameover.style.display = 'flex';
  }
}

/* ============================== INPUT ============================== */

const input = {
  moveX: 0, moveY: 0,
  firing: false,
  keys: {},
};
const stickEl = document.getElementById('stick');
const knobEl = document.getElementById('knob');
const fireEl = document.getElementById('firebtn');

let moveTouch = null, lookTouch = null;
const lookLast = { x: 0, y: 0 };
const STICK_RANGE = 44;
const LOOK_SENS = 0.0045;

function onTouchStart(e) {
  e.preventDefault();
  audioInit();
  for (const t of e.changedTouches) {
    if (t.clientX < window.innerWidth * 0.45 && moveTouch === null) {
      moveTouch = { id: t.identifier, ox: t.clientX, oy: t.clientY };
      stickEl.style.display = 'block';
      stickEl.style.left = t.clientX + 'px';
      stickEl.style.top = t.clientY + 'px';
      knobEl.style.transform = 'translate(-50%,-50%)';
    } else if (lookTouch === null) {
      lookTouch = t.identifier;
      lookLast.x = t.clientX; lookLast.y = t.clientY;
    }
  }
}
function onTouchMove(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (moveTouch && t.identifier === moveTouch.id) {
      let dx = t.clientX - moveTouch.ox, dy = t.clientY - moveTouch.oy;
      const len = Math.hypot(dx, dy);
      if (len > STICK_RANGE) { dx *= STICK_RANGE / len; dy *= STICK_RANGE / len; }
      input.moveX = dx / STICK_RANGE;
      input.moveY = dy / STICK_RANGE;
      knobEl.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    } else if (t.identifier === lookTouch) {
      player.yaw -= (t.clientX - lookLast.x) * LOOK_SENS;
      player.pitch -= (t.clientY - lookLast.y) * LOOK_SENS;
      player.pitch = Math.max(-1.35, Math.min(1.35, player.pitch));
      lookLast.x = t.clientX; lookLast.y = t.clientY;
    }
  }
}
function onTouchEnd(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (moveTouch && t.identifier === moveTouch.id) {
      moveTouch = null;
      input.moveX = input.moveY = 0;
      stickEl.style.display = 'none';
    } else if (t.identifier === lookTouch) {
      lookTouch = null;
    }
  }
}
renderer.domElement.addEventListener('touchstart', onTouchStart, { passive: false });
renderer.domElement.addEventListener('touchmove', onTouchMove, { passive: false });
renderer.domElement.addEventListener('touchend', onTouchEnd, { passive: false });
renderer.domElement.addEventListener('touchcancel', onTouchEnd, { passive: false });

fireEl.addEventListener('touchstart', e => {
  e.preventDefault(); e.stopPropagation();
  audioInit();
  input.firing = true;
  fireEl.classList.add('pressed');
}, { passive: false });
fireEl.addEventListener('touchend', e => {
  e.preventDefault(); e.stopPropagation();
  input.firing = false;
  fireEl.classList.remove('pressed');
}, { passive: false });

// desktop fallback for testing: WASD + mouse drag + click to fire
window.addEventListener('keydown', e => { input.keys[e.code] = true; });
window.addEventListener('keyup', e => { input.keys[e.code] = false; });
let mouseDown = false;
renderer.domElement.addEventListener('mousedown', e => { audioInit(); mouseDown = true; input.firing = true; lookLast.x = e.clientX; lookLast.y = e.clientY; });
window.addEventListener('mouseup', () => { mouseDown = false; input.firing = false; });
window.addEventListener('mousemove', e => {
  if (!mouseDown) return;
  player.yaw -= (e.clientX - lookLast.x) * LOOK_SENS;
  player.pitch = Math.max(-1.35, Math.min(1.35, player.pitch - (e.clientY - lookLast.y) * LOOK_SENS));
  lookLast.x = e.clientX; lookLast.y = e.clientY;
});

document.getElementById('startbtn').addEventListener('click', () => {
  audioInit();
  ui.start.style.display = 'none';
  state = 'playing';
  resetGame();
});
document.getElementById('restartbtn').addEventListener('click', () => {
  ui.gameover.style.display = 'none';
  state = 'playing';
  resetGame();
});

/* ============================== COMBAT ============================== */

const FIRE_RATE = 0.13;
const tmpV = new THREE.Vector3();
const tmpV2 = new THREE.Vector3();

function playerShoot() {
  const dir = new THREE.Vector3(0, 0, -1).applyEuler(new THREE.Euler(player.pitch, player.yaw, 0, 'YXZ'));
  const origin = player.pos.clone().addScaledVector(dir, 0.6);
  origin.y -= 0.12;
  const shot = playerShots.fire(origin, dir.multiplyScalar(70), 1.2);
  if (shot) {
    player.recoil = 1;
    sfx.shoot();
    if (navigator.vibrate) navigator.vibrate(8);
  }
}

function updatePlayerShots(dt) {
  for (const p of playerShots.items) {
    if (!p.active) continue;
    p.life -= dt;
    if (p.life <= 0) { p.active = false; continue; }
    const prev = tmpV.copy(p.pos);
    p.pos.addScaledVector(p.vel, dt);
    // wall hit
    const h = blocked.get(cellKey(Math.round(p.pos.x), Math.round(p.pos.z)));
    if ((h !== undefined && p.pos.y < h) || p.pos.y < 0 ||
        Math.abs(p.pos.x) > ARENA || Math.abs(p.pos.z) > ARENA) {
      p.active = false;
      explode(p.pos, PALETTE.yellow, PALETTE.cyan, 4);
      continue;
    }
    // bot hit: distance from bot center to segment prev->pos
    for (const b of bots) {
      if (!b.alive) continue;
      const seg = tmpV2.copy(p.pos).sub(prev);
      const segLen2 = seg.lengthSq();
      let t = 0;
      if (segLen2 > 0) {
        t = Math.max(0, Math.min(1, b.pos.clone().sub(prev).dot(seg) / segLen2));
      }
      const closest = prev.clone().addScaledVector(seg, t);
      if (closest.distanceTo(b.pos) < 0.95) {
        p.active = false;
        b.hp -= 25;
        b.flash = 0.12;
        sfx.hit();
        explode(closest, b.tint, 0xffffff, 5);
        if (b.hp <= 0) killBot(b);
        break;
      }
    }
  }
}

function killBot(b) {
  b.alive = false;
  scene.remove(b.group);
  explode(b.pos, b.tint, 0x241048, 26);
  sfx.boom();
  if (navigator.vibrate) navigator.vibrate([20, 30, 20]);
  score += 100;
  ui.score.textContent = score;
}

function updateBotShots(dt) {
  for (const p of botShots.items) {
    if (!p.active) continue;
    p.life -= dt;
    if (p.life <= 0) { p.active = false; continue; }
    p.pos.addScaledVector(p.vel, dt);
    const h = blocked.get(cellKey(Math.round(p.pos.x), Math.round(p.pos.z)));
    if ((h !== undefined && p.pos.y < h) || p.pos.y < 0) {
      p.active = false;
      explode(p.pos, PALETTE.magenta, PALETTE.purple, 3);
      continue;
    }
    if (p.pos.distanceTo(player.pos) < 0.6) {
      p.active = false;
      damagePlayer(8 + wave);
    }
  }
}

function updateBots(dt, time) {
  for (let i = bots.length - 1; i >= 0; i--) {
    const b = bots[i];
    if (!b.alive) { bots.splice(i, 1); continue; }

    const toPlayer = tmpV.copy(player.pos).sub(b.pos); toPlayer.y = 0;
    const dist = toPlayer.length();
    toPlayer.normalize();

    // approach / orbit
    const speed = 2.6 + wave * 0.15;
    let mx = 0, mz = 0;
    if (dist > b.standoff + 1) { mx = toPlayer.x; mz = toPlayer.z; }
    else if (dist < b.standoff - 1) { mx = -toPlayer.x; mz = -toPlayer.z; }
    // orbit strafe
    mx += -toPlayer.z * 0.7 * b.orbitDir;
    mz += toPlayer.x * 0.7 * b.orbitDir;

    const nx = b.pos.x + mx * speed * dt;
    const nz = b.pos.z + mz * speed * dt;
    if (!isBlocked(Math.round(nx), Math.round(b.pos.z))) b.pos.x = nx;
    else b.orbitDir *= -1;
    if (!isBlocked(Math.round(b.pos.x), Math.round(nz))) b.pos.z = nz;
    else b.orbitDir *= -1;

    b.pos.y = b.hover + Math.sin(time * 2.2 + b.phase) * 0.25;

    // face the player
    b.group.position.copy(b.pos);
    b.group.rotation.y = Math.atan2(player.pos.x - b.pos.x, player.pos.z - b.pos.z);
    b.group.rotation.z = Math.sin(time * 2.2 + b.phase) * 0.08;

    // hit flash
    if (b.flash > 0) {
      b.flash -= dt;
      b.bodyMat.color.setHex(0xffffff);
      b.bodyMat.emissive.setHex(0xffffff);
    } else {
      b.bodyMat.color.setHex(0x241048);
      b.bodyMat.emissive.setHex(0x000000);
    }

    // shooting
    b.shootTimer -= dt;
    if (b.shootTimer <= 0 && dist < 32 && hasLOS(b.pos, player.pos)) {
      b.shootTimer = Math.max(0.8, 2.2 - wave * 0.1) + Math.random();
      const dir = tmpV2.copy(player.pos).sub(b.pos).normalize();
      // slight inaccuracy so it's dodgeable
      dir.x += (Math.random() - 0.5) * 0.08;
      dir.y += (Math.random() - 0.5) * 0.04;
      dir.z += (Math.random() - 0.5) * 0.08;
      botShots.fire(b.pos.clone().addScaledVector(dir, 0.8), dir.normalize().multiplyScalar(13), 4);
      blip(520, 0.12, 'square', 0.08, 0.5);
    }
  }
}

/* ============================== MAIN LOOP ============================== */

const clock = new THREE.Clock();
const camEuler = new THREE.Euler(0, 0, 0, 'YXZ');

function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  const time = clock.elapsedTime;

  if (state === 'playing') {
    // movement: joystick + keyboard
    let mx = input.moveX, my = input.moveY;
    if (input.keys.KeyW) my -= 1;
    if (input.keys.KeyS) my += 1;
    if (input.keys.KeyA) mx -= 1;
    if (input.keys.KeyD) mx += 1;
    const mlen = Math.hypot(mx, my);
    if (mlen > 1) { mx /= mlen; my /= mlen; }
    const SPEED = 6.5;
    const sin = Math.sin(player.yaw), cos = Math.cos(player.yaw);
    tryMove((mx * cos + my * sin) * SPEED * dt, (my * cos - mx * sin) * SPEED * dt);

    // firing
    player.fireCooldown -= dt;
    if (input.firing && player.fireCooldown <= 0 && player.alive) {
      player.fireCooldown = FIRE_RATE;
      playerShoot();
    }

    // wave management
    if (pendingSpawns > 0) {
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnTimer = 0.7;
        spawnBot();
        pendingSpawns--;
      }
    } else if (bots.length === 0) {
      waveDelay += dt;
      if (waveDelay > 2.5) { waveDelay = 0; startWave(); }
    }

    updateBots(dt, time);
    updatePlayerShots(dt);
    updateBotShots(dt);
  }

  updateDebris(dt);

  // camera: yaw/pitch + recoil + shake + idle bob
  player.recoil = Math.max(0, player.recoil - dt * 8);
  player.shake = Math.max(0, player.shake - dt);
  camEuler.set(player.pitch + player.recoil * 0.03, player.yaw, 0);
  camera.quaternion.setFromEuler(camEuler);
  camera.position.copy(player.pos);
  camera.position.y += Math.sin(time * 1.7) * 0.03;
  if (player.shake > 0) {
    camera.position.x += (Math.random() - 0.5) * player.shake * 0.3;
    camera.position.y += (Math.random() - 0.5) * player.shake * 0.3;
  }

  playerShots.render();
  botShots.render();
  renderer.render(scene, camera);
}
tick();
</script>
