let keys = {}, keysJust = {};

// --- Input ---
document.addEventListener('keydown', e => {
  if (!keys[e.code]) keysJust[e.code] = true;
  keys[e.code] = true;
  // Handle single-press actions
  if (gameState==='overworld') {
    if (e.code==='KeyM') GameMenu.toggle();
    if (e.code==='Space'||e.code==='Enter') interact();
  }
  if (gameState==='dialogue') {
    if (e.code==='Space'||e.code==='Enter'||e.code==='KeyZ') Dialogue.advance();
  }
  if (gameState==='menu') {
    if (e.code==='Escape'||e.code==='KeyM') GameMenu.close();
  }
  e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

function justPressed(code) { return keysJust[code]; }

// --- Audio Engine ---
const Audio = {
  ctx: null,
  masterGain: null,
  bgmOsc: [],
  init() {
    if (this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.masterGain = this.ctx.createGain();
    this.masterGain.gain.value = 0.15;
    this.masterGain.connect(this.ctx.destination);
  },
  tone(freq, dur, type='square', vol=0.5, delay=0) {
    if (!this.ctx) this.init();
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.value = 0;
    g.gain.setValueAtTime(vol * 0.15, this.ctx.currentTime + delay);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + delay + dur);
    o.connect(g); g.connect(this.masterGain);
    o.start(this.ctx.currentTime + delay);
    o.stop(this.ctx.currentTime + delay + dur);
  },
  jingle(type) {
    this.init();
    const j = {
      start: [[523,0.12],[659,0.12],[784,0.12],[1047,0.25]],
      hit: [[200,0.06,'sawtooth'],[150,0.1,'sawtooth']],
      superHit: [[250,0.06,'sawtooth'],[200,0.08,'sawtooth'],[350,0.12,'sawtooth']],
      miss: [[400,0.08,'sine'],[300,0.15,'sine']],
      levelUp: [[523,0.15],[587,0.15],[659,0.15],[784,0.15],[1047,0.3]],
      catch: [[440,0.12],[440,0.12],[440,0.12],[660,0.1],[880,0.3]],
      catchFail: [[400,0.1],[300,0.1],[200,0.2]],
      heal: [[523,0.1,'sine'],[659,0.1,'sine'],[784,0.1,'sine'],[1047,0.15,'sine']],
      victory: [[523,0.12],[523,0.08],[659,0.12],[784,0.2],[659,0.08],[784,0.08],[1047,0.35]],
      run: [[500,0.08],[400,0.08],[300,0.12]],
      select: [[600,0.06],[800,0.06]],
      bump: [[150,0.06,'sine']],
      evolve: [[261,0.15],[329,0.15],[392,0.15],[523,0.15],[659,0.15],[784,0.2],[1047,0.35]],
      encounter: [[200,0.08,'sawtooth'],[300,0.08,'sawtooth'],[200,0.08,'sawtooth'],[400,0.15,'square']],
      step: [[80,0.03,'sine']],
    };
    const notes = j[type];
    if (!notes) return;
    let t = 0;
    for (const n of notes) {
      this.tone(n[0], n[1], n[2]||'square', n[3]||0.5, t);
      t += n[1] * 0.9;
    }
  },
  bgm(song) {
    this.stopBgm();
    if (!this.ctx) this.init();
    // Simple looping melody
    const songs = {
      town: { tempo: 0.25, notes: [523,587,659,784,659,587,523,440,523,587,659,523,440,392,440,523], bass: [261,261,329,329,261,261,220,220,261,261,329,329,220,220,196,261] },
      route: { tempo: 0.2, notes: [440,523,587,659,587,523,440,392,440,523,659,784,659,523,440,392], bass: [220,220,293,293,220,220,196,196,220,220,329,329,220,220,196,196] },
      battle: { tempo: 0.15, notes: [659,659,784,659,523,659,784,1047,784,659,523,440,523,659,784,659], bass: [329,329,392,329,261,329,392,523,392,329,261,220,261,329,392,329] },
    };
    const s = songs[song]; if (!s) return;
    let i = 0;
    this._bgmInterval = setInterval(() => {
      this.tone(s.notes[i % s.notes.length], s.tempo * 0.8, 'square', 0.2);
      this.tone(s.bass[i % s.bass.length], s.tempo * 0.9, 'triangle', 0.15);
      i++;
    }, s.tempo * 1000);
  },
  stopBgm() { if (this._bgmInterval) { clearInterval(this._bgmInterval); this._bgmInterval = null; } }
};

// --- Pixel Art Sprite System ---
const Sprites = {
  cache: {},
  draw(name, x, y, w, h, flipX=false, palette=null) {
    const data = this.getData(name);
    if (!data) return;
    const pw = data[0].length, ph = data.length;
    const sx = w / pw, sy = h / ph;
    X.save();
    if (flipX) { X.translate(x + w, y); X.scale(-1, 1); x = 0; y = 0; }
    for (let py = 0; py < ph; py++) {
      for (let px = 0; px < pw; px++) {
        const c = data[py][px];
        if (c === '.') continue;
        const color = palette ? (palette[c] || c) : this.colorMap[c];
        if (!color) continue;
        X.fillStyle = color;
        X.fillRect(Math.floor(x + px * sx), Math.floor(y + py * sy), Math.ceil(sx), Math.ceil(sy));
      }
    }
    X.restore();
  },

  satirical: { name:'Satirical', color:'#9b59b6', strong:['rhetoric','dramatic'], weak:['poetic','gothic'] },
  gothic:    { name:'Gothic',    color:'#636e72', strong:['narrative','satirical'],weak:['rhetoric','dramatic'] },

function typeEffect(atk, def) {
  if (TYPES[atk].strong.includes(def)) return 2;
  if (TYPES[atk].weak.includes(def)) return 0.5;
  return 1;
}

// --- Creature Factory ---
function makeCreature(id, level) {
  const d = CREATURES[id]; if (!d) return null;
  const c = {
    id, name:d.name, type:d.type, sprite:d.sprite, level,
    base:{...d.base}, mods:{atk:0,def:0,spd:0}, desc:d.desc, evoDef:d.evo,
    xp:0, moves:[]
  };
  // Assign moves based on level
  const available = d.moves.slice(0, Math.min(4, 2 + Math.floor(level/5)));
  c.moves = available.map(mid => ({...MOVES[mid], id:mid, curPP:MOVES[mid].pp}));
  calcStats(c);
  c.hp = c.maxHp;
  return c;
}
function calcStats(c) {
  c.maxHp = Math.floor(c.base.hp + c.level*2.5 + 10);
  c.atk = Math.floor(c.base.atk + c.level*1.5);
  c.def = Math.floor(c.base.def + c.level*1.5);
  c.spd = Math.floor(c.base.spd + c.level*1.5);
  c.xpNext = Math.floor(c.level*c.level*1.5 + 10);
}

// --- Smooth Movement ---
const MOVE_SPEED = 3; // pixels per frame

function updatePlayer() {
  if (P.moving) {
    P.moveProgress += MOVE_SPEED;
    const dirs = {up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
    const [dx,dy] = dirs[P.moveDir];
    P.px = (P.x + dx * (P.moveProgress/TS)) * TS;
    P.py = (P.y + dy * (P.moveProgress/TS)) * TS;
    P.walkTimer++;
    if (P.walkTimer % 8 === 0) P.walkFrame = 1 - P.walkFrame;
    if (P.moveProgress >= TS) {
      P.x += dx; P.y += dy;
      P.px = P.x * TS; P.py = P.y * TS;
      P.moving = false; P.moveProgress = 0;
      onStepComplete();
    }
    return;
  }

  let dx=0, dy=0, dir=null;
  if (keys['ArrowUp']||keys['KeyW']) { dy=-1; dir='up'; }
  else if (keys['ArrowDown']||keys['KeyS']) { dy=1; dir='down'; }
  else if (keys['ArrowLeft']||keys['KeyA']) { dx=-1; dir='left'; }
  else if (keys['ArrowRight']||keys['KeyD']) { dx=1; dir='right'; }

  if (!dir) { P.walkFrame=0; return; }
  P.dir = dir;

  const map = MAPS[P.mapId];
  const nx = P.x+dx, ny = P.y+dy;

  // Connection check
  for (const conn of (map.connections||[])) {
    if (nx===conn.x && ny===conn.y) {
      Transition.start(() => {
        P.mapId=conn.toMap; P.x=conn.toX; P.y=conn.toY;
        P.px=P.x*TS; P.py=P.y*TS;
        if (MAPS[conn.toMap].music) Audio.bgm(MAPS[conn.toMap].music);
      });
      return;
    }
  }

  if (nx<0||ny<0||nx>=map.width||ny>=map.height) { return; }
  const tile = map.data[ny][nx];
  if (!WALKABLE.includes(tile)) { return; }
  // NPC collision
  for (const npc of (map.npcs||[])) { if (npc.x===nx&&npc.y===ny) return; }

  P.moving = true; P.moveDir = dir; P.moveProgress = 0;
  if (frame % 3 === 0) Audio.jingle('step');
}

function onStepComplete() {
  const map = MAPS[P.mapId];
  const tile = map.data[P.y][P.x];
  if (tile === TILE.TALL_GRASS && Math.random() < (map.encounterRate||0.12)) {
    startWildEncounter();
  }
  if (tile === TILE.HEAL) {
    P.party.forEach(c => { c.hp=c.maxHp; c.moves.forEach(m => m.curPP=m.pp); });
    Audio.jingle('heal');
    Notification.show('Your team was healed!');
  }
}

function interact() {
  const map = MAPS[P.mapId];
  const dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
  const [dx,dy] = dirs[P.dir];
  const tx=P.x+dx, ty=P.y+dy;

  for (const npc of (map.npcs||[])) {
    if (npc.x===tx && npc.y===ty) {
      if (npc.battle && !P.defeated.includes(npc.name)) {
        Dialogue.start(npc.dialogue, () => startTrainerBattle(npc));
      } else if (npc.battle) {
        Dialogue.start([{s:npc.name,t:'Great battle earlier!'}]);
      } else {
        Dialogue.start(npc.dialogue);
      }
      return;
    }
  }
  for (const sign of (map.signs||[])) {
    if (sign.x===tx && sign.y===ty) {
      Dialogue.start([{s:'Sign',t:sign.text}]);
      return;
    }
  }
}

// --- Transition Effect ---
const Transition = {
  active:false, alpha:0, phase:'out', cb:null, type:'fade',
  start(cb, type='fade') { this.active=true; this.alpha=0; this.phase='out'; this.cb=cb; this.type=type; },
  update() {
    if (!this.active) return;
    if (this.phase==='out') {
      this.alpha += 0.06;
      if (this.alpha >= 1) { this.alpha=1; if(this.cb){this.cb();this.cb=null;} this.phase='in'; }
    } else {
      this.alpha -= 0.06;
      if (this.alpha <= 0) { this.alpha=0; this.active=false; }
    }
  },
  draw() {
    if (!this.active) return;
    X.fillStyle = `rgba(0,0,0,${this.alpha})`;
    X.fillRect(0,0,W,H);
  }
};

// --- Notification ---
const Notification = {
  text:'', timer:0,
  show(t) { this.text=t; this.timer=120; },
  update() { if(this.timer>0) this.timer--; },
  draw() {
    if (this.timer<=0) return;
    const a = Math.min(1, this.timer/20);
    X.save();
    X.globalAlpha = a;
    X.fillStyle = 'rgba(0,0,0,0.85)';
    const tw = X.measureText(this.text).width;
    const bx = W/2-tw/2-20, by = H/2-20;
    roundRect(bx,by,tw+40,40,10);
    X.fill();
    X.strokeStyle = '#f0c040';
    X.lineWidth = 2;
    roundRect(bx,by,tw+40,40,10);
    X.stroke();
    X.fillStyle = '#f0c040';
    X.font = '16px monospace';
    X.textAlign = 'center';
    X.fillText(this.text, W/2, H/2+6);
    X.restore();
  }
};

// --- Dialogue System ---
const Dialogue = {
  queue:[], cb:null, text:'', displayText:'', charIdx:0, speaker:'', typing:false,
  start(msgs, cb=null) {
    this.queue = msgs.map(m => ({speaker:m.s||'',text:m.t||m.text||''}));
    this.cb = cb;
    gameState = 'dialogue';
    this.showNext();
  },
  showNext() {
    if (this.queue.length===0) { this.close(); return; }
    const msg = this.queue.shift();
    this.speaker = msg.speaker;
    this.text = msg.text;
    this.displayText = '';
    this.charIdx = 0;
    this.typing = true;
  },
  update() {
    if (this.typing && this.charIdx < this.text.length) {
      this.charIdx += 1;
      this.displayText = this.text.substring(0, this.charIdx);
      if (this.charIdx >= this.text.length) this.typing = false;
    }
  },
  advance() {
    Audio.jingle('select');
    if (this.typing) {
      this.displayText = this.text;
      this.charIdx = this.text.length;
      this.typing = false;
      return;
    }
    this.showNext();
  },
  close() {
    gameState = 'overworld';
    if (this.cb) { const cb=this.cb; this.cb=null; cb(); }
  },
  draw() {
    // Box
    X.fillStyle = 'rgba(10,10,30,0.95)';
    roundRect(20, H-140, W-40, 120, 12);
    X.fill();
    X.strokeStyle = '#e2b340';
    X.lineWidth = 3;
    roundRect(20, H-140, W-40, 120, 12);
    X.stroke();
    // Speaker
    if (this.speaker) {
      X.fillStyle = '#f0c040';
      X.font = 'bold 16px monospace';
      X.textAlign = 'left';
      X.fillText(this.speaker, 45, H-110);
    }
    // Text with word wrap
    X.fillStyle = '#eee';
    X.font = '15px monospace';
    wrapText(this.displayText, 45, H-85, W-90, 22);
    // Continue indicator
    if (!this.typing) {
      X.fillStyle = `rgba(255,255,255,${0.5+Math.sin(frame*0.1)*0.5})`;
      X.font = '14px monospace';
      X.textAlign = 'right';
      X.fillText('▼', W-40, H-30);
    }
  }
};

function wrapText(text, x, y, maxW, lineH) {
  X.textAlign = 'left';
  const words = text.split(' ');
  let line = '';
  let cy = y;
  for (const word of words) {
    const test = line + word + ' ';
    if (X.measureText(test).width > maxW && line !== '') {
      X.fillText(line, x, cy);
      line = word + ' ';
      cy += lineH;
    } else {
      line = test;
    }
  }
  X.fillText(line, x, cy);
}

function roundRect(x,y,w,h,r) {
  X.beginPath();
  X.moveTo(x+r,y); X.lineTo(x+w-r,y); X.quadraticCurveTo(x+w,y,x+w,y+r);
  X.lineTo(x+w,y+h-r); X.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  X.lineTo(x+r,y+h); X.quadraticCurveTo(x,y+h,x,y+h-r);
  X.lineTo(x,y+r); X.quadraticCurveTo(x,y,x+r,y);
  X.closePath();
}

// --- Particle System ---
const Particles = {
  list: [],
  spawn(x, y, count, color, speed=3, life=30, size=4) {
    for (let i=0;i<count;i++) {
      const angle = Math.random()*Math.PI*2;
      const spd = Math.random()*speed + 1;
      this.list.push({
        x, y, vx:Math.cos(angle)*spd, vy:Math.sin(angle)*spd,
        life, maxLife:life, color, size: Math.random()*size+2
      });
    }
  },
  update() {
    for (let i=this.list.length-1;i>=0;i--) {
      const p = this.list[i];
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.1; // gravity
      p.life--;
      if (p.life<=0) this.list.splice(i,1);
    }
  },
  draw() {
    for (const p of this.list) {
      X.globalAlpha = p.life/p.maxLife;
      X.fillStyle = p.color;
      X.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size);
    }
    X.globalAlpha = 1;
  }
};

// --- Battle Encounter Transition ---
const EncounterTransition = {
  active:false, timer:0, cb:null, phase:0,
  start(cb) {
    this.active=true; this.timer=0; this.cb=cb; this.phase=0;
    Audio.jingle('encounter');
  },
  update() {
    if (!this.active) return;
    this.timer++;
    if (this.timer < 15) {
      this.phase = 0; // flash
    } else if (this.timer < 60) {
      this.phase = 1; // sliding bars
    } else {
      this.active = false;
      if(this.cb) this.cb();
    }
  },
  draw() {
    if (!this.active) return;
    if (this.phase === 0) {
      // White flash
      const a = this.timer < 5 ? this.timer/5 : (this.timer < 10 ? 1 : (15-this.timer)/5);
      X.fillStyle = `rgba(255,255,255,${a})`;
      X.fillRect(0,0,W,H);
    } else {
      // Horizontal bars sliding in
      const progress = (this.timer - 15) / 45;
      const barH = 30;
      const bars = Math.ceil(H / barH);
      X.fillStyle = '#000';
      for (let i = 0; i < bars; i++) {
        const dir = i % 2 === 0 ? 1 : -1;
        const offset = (1 - progress) * W * dir;
        X.fillRect(offset, i * barH, W, barH);
      }
    }
  }
};

// --- Rendering: Overworld ---
const TILE_PAL = {
  [TILE.GRASS]:'#3a7d44', [TILE.PATH]:'#c4a35a', [TILE.TALL_GRASS]:'#2d6b35',
  [TILE.TREE]:'#1a4d2e', [TILE.WATER]:'#2563a8', [TILE.BUILDING]:'#6d5c4e',
  [TILE.DOOR]:'#8b4513', [TILE.SIGN]:'#c4a35a', [TILE.FLOWER]:'#3a7d44',
  [TILE.FENCE]:'#8b7355', [TILE.HEAL]:'#ff6b6b', [TILE.BRIDGE]:'#a0845c'
};

function drawOverworld() {
  const map = MAPS[P.mapId]; if(!map) return;
  const camX = P.px - W/2 + TS/2;
  const camY = P.py - H/2 + TS/2;
  const cx = Math.max(0, Math.min(camX, map.width*TS - W));
  const cy = Math.max(0, Math.min(camY, map.height*TS - H));

  const stx = Math.floor(cx/TS), sty = Math.floor(cy/TS);
  const etx = Math.min(map.width-1, stx+Math.ceil(W/TS)+1);
  const ety = Math.min(map.height-1, sty+Math.ceil(H/TS)+1);

  for (let y=sty;y<=ety;y++) {
    for (let x=stx;x<=etx;x++) {
      const tile = map.data[y][x];
      const sx = x*TS-cx, sy = y*TS-cy;
      drawTile(tile, sx, sy, x, y);
    }
  }

  // NPCs
  for (const npc of (map.npcs||[])) {
    const sx = npc.x*TS-cx, sy = npc.y*TS-cy;
    if (sx>-TS&&sx<W+TS&&sy>-TS&&sy<H+TS) {
      Sprites.draw(npc.sprite, sx+2, sy+2, TS-4, TS-4);
      // Shadow
      X.fillStyle='rgba(0,0,0,0.2)';
      X.beginPath();
      X.ellipse(sx+TS/2, sy+TS-3, 10, 3, 0, 0, Math.PI*2);
      X.fill();
    }
  }

  // Player
  const ppx = P.px - cx, ppy = P.py - cy;
  // Shadow
  X.fillStyle='rgba(0,0,0,0.25)';
  X.beginPath();
  X.ellipse(ppx+TS/2, ppy+TS-2, 10, 4, 0, 0, Math.PI*2);
  X.fill();
  // Sprite
  let spriteName = 'player_' + P.dir;
  if (P.moving && P.walkFrame) spriteName = 'player_walk_down'; // simplified
  Sprites.draw(spriteName, ppx+2, ppy, TS-4, TS);

  // Draw tall grass overlay (on top of player if in tall grass)
  if (map.data[P.y] && map.data[P.y][P.x] === TILE.TALL_GRASS) {
    const osx = P.x*TS-cx, osy = P.y*TS-cy;
    drawTallGrassOverlay(osx, osy, P.x, P.y);
  }

  // HUD
  drawHUD(map);
  // Minimap
  drawMinimap(map, cx, cy);
}

function drawTile(tile, sx, sy, tx, ty) {
  // Base
  X.fillStyle = TILE_PAL[tile] || '#3a7d44';
  X.fillRect(sx, sy, TS, TS);

  switch(tile) {
    case TILE.GRASS:
      // Subtle grass texture
      X.fillStyle = '#3e8348';
      if((tx+ty)%3===0) X.fillRect(sx+8,sy+12,2,8);
      if((tx+ty)%5===1) X.fillRect(sx+20,sy+6,2,10);
      break;
    case TILE.TALL_GRASS:
      X.fillStyle = '#1e5428';
      for(let i=0;i<4;i++) {
        const gx=sx+3+i*7, sway=Math.sin(frame*0.04+tx+ty+i)*2;
        X.fillRect(gx+sway,sy+4,2,24);
        X.fillRect(gx+sway-3,sy+2,8,4);
      }
      X.fillStyle='#25632f';
      X.fillRect(sx+2+Math.sin(frame*0.05+tx)*1,sy+10,3,16);
      break;
    case TILE.TREE:
      // Trunk
      X.fillStyle='#5d3a1a';
      X.fillRect(sx+12,sy+18,8,14);
      // Canopy layers
      X.fillStyle='#1a5c2e';
      X.beginPath(); X.arc(sx+16,sy+12,13,0,Math.PI*2); X.fill();
      X.fillStyle='#1a6e32';
      X.beginPath(); X.arc(sx+14,sy+9,9,0,Math.PI*2); X.fill();
      X.fillStyle='#22803a';
      X.beginPath(); X.arc(sx+18,sy+8,7,0,Math.PI*2); X.fill();
      break;
    case TILE.WATER:
      X.fillStyle='#1d5faa';
      const wo=Math.sin(frame*0.025+tx*0.5+ty*0.3)*3;
      X.fillRect(sx,sy+12+wo,TS,4);
      X.fillStyle='#3a9fd8';
      X.fillRect(sx+4,sy+5+wo,12,2);
      X.fillRect(sx+18,sy+20+wo,8,2);
      X.fillStyle='#1a4e8a';
      X.fillRect(sx+10,sy+25+wo,6,2);
      break;
    case TILE.BUILDING:
      X.fillStyle='#5a4a3e';
      X.fillRect(sx+1,sy+1,30,30);
      X.fillStyle='#4a3828';
      X.fillRect(sx,sy,TS,5);
      X.fillStyle='#756050';
      X.fillRect(sx,sy+28,TS,4);
      // Window
      X.fillStyle='#ffd700';
      X.fillRect(sx+8,sy+10,14,10);
      X.fillStyle='#fff8dc';
      X.fillRect(sx+10,sy+12,10,6);
      X.fillStyle='#4a3828';
      X.fillRect(sx+14,sy+10,2,10);
      X.fillRect(sx+8,sy+14,14,2);
      break;
    case TILE.DOOR:
      X.fillStyle='#5a4a3e'; X.fillRect(sx+1,sy+1,30,30);
      X.fillStyle='#8b4513'; X.fillRect(sx+8,sy+2,16,30);
      X.fillStyle='#a0522d'; X.fillRect(sx+10,sy+4,12,26);
      X.fillStyle='#ffd700'; X.beginPath(); X.arc(sx+19,sy+18,2,0,Math.PI*2); X.fill();
      break;
    case TILE.HEAL:
      X.fillStyle='#cc4444'; X.fillRect(sx+2,sy+2,28,28);
      X.fillStyle='#ff6b6b'; X.fillRect(sx+4,sy+4,24,24);
      X.fillStyle='#fff';
      X.fillRect(sx+12,sy+6,8,20); X.fillRect(sx+6,sy+12,20,8);
      // Pulsing glow
      X.fillStyle=`rgba(255,100,100,${0.2+Math.sin(frame*0.08)*0.15})`;
      X.beginPath(); X.arc(sx+16,sy+16,18,0,Math.PI*2); X.fill();
      break;
    case TILE.FENCE:
      X.fillStyle='#6d5c4e';
      X.fillRect(sx+2,sy+10,28,4); X.fillRect(sx+2,sy+20,28,4);
      X.fillStyle='#8b7355';
      X.fillRect(sx+4,sy+5,4,24); X.fillRect(sx+24,sy+5,4,24);
      break;
    case TILE.SIGN:
      X.fillStyle='#c4a35a'; X.fillRect(sx,sy,TS,TS);
      X.fillStyle='#8b7355'; X.fillRect(sx+12,sy+18,8,14);
      X.fillStyle='#deb887'; X.fillRect(sx+4,sy+4,24,16);
      X.fillStyle='#5a3e28';
      X.fillRect(sx+7,sy+8,18,2); X.fillRect(sx+7,sy+14,14,2);
      // Exclamation on approach
      if (Math.abs(P.x-tx)<=1 && Math.abs(P.y-ty)<=1) {
        X.fillStyle='#f0c040';
        X.font='bold 12px monospace'; X.textAlign='center';
        X.fillText('!', sx+16, sy-2);
      }
      break;
    case TILE.FLOWER:
      X.fillStyle='#3a7d44'; X.fillRect(sx,sy,TS,TS);
      const fcolors=['#ff69b4','#ff6347','#ffd700','#da70d6','#87ceeb'];
      for(let i=0;i<4;i++) {
        X.fillStyle=fcolors[(tx+ty+i)%fcolors.length];
        const fx=sx+4+i*7, fy=sy+10+Math.sin(frame*0.03+i+tx)*2;
        X.beginPath(); X.arc(fx,fy,3,0,Math.PI*2); X.fill();
        X.fillStyle='#ffff00'; X.beginPath(); X.arc(fx,fy,1,0,Math.PI*2); X.fill();
        X.fillStyle='#2d6b35'; X.fillRect(fx-0.5,fy+3,1,12);
      }
      break;
    case TILE.PATH:
      X.fillStyle='#b89a4a';
      if((tx+ty)%4===0) X.fillRect(sx+4,sy+4,4,4);
      if((tx+ty)%6===2) X.fillRect(sx+20,sy+20,5,5);
      if((tx+ty)%5===3) X.fillRect(sx+14,sy+8,3,3);
      break;
    case TILE.BRIDGE:
      X.fillStyle='#8b7355'; X.fillRect(sx,sy,TS,3); X.fillRect(sx,sy+29,TS,3);
      X.fillStyle='#6d5c4e';
      X.fillRect(sx+4,sy+3,3,26); X.fillRect(sx+25,sy+3,3,26);
      break;
  }
}

function drawTallGrassOverlay(sx, sy, tx, ty) {
  X.fillStyle = 'rgba(30,84,40,0.6)';
  for(let i=0;i<3;i++) {
    const gx=sx+5+i*9, sway=Math.sin(frame*0.04+tx+ty+i)*2;
    X.fillRect(gx+sway,sy+16,3,16);
  }
}

function drawHUD(map) {
  // Top left: area name + party preview
  X.fillStyle='rgba(0,0,0,0.7)';
  roundRect(8,8,220,20+P.party.length*18,8);
  X.fill();
  X.strokeStyle='rgba(255,255,255,0.2)'; X.lineWidth=1;
  roundRect(8,8,220,20+P.party.length*18,8);
  X.stroke();

  X.fillStyle='#f0c040'; X.font='bold 13px monospace'; X.textAlign='left';
  X.fillText(map.name, 18, 25);

  P.party.forEach((c,i) => {
    const cy = 40 + i*18;
    X.fillStyle='#ddd'; X.font='12px monospace';
    X.fillText(`${c.name} Lv${c.level}`, 18, cy);
    // Mini HP bar
    const barX=160, barW=55, barH=6;
    X.fillStyle='#333'; X.fillRect(barX,cy-6,barW,barH);
    const pct=Math.max(0,c.hp/c.maxHp);
    X.fillStyle=pct>0.5?'#4caf50':pct>0.25?'#ff9800':'#f44336';
    X.fillRect(barX,cy-6,barW*pct,barH);
  });
}

function drawMinimap(map, cx, cy) {
  const mw=100,mh=80;
  const mx=W-mw-10, my=10;
  X.fillStyle='rgba(0,0,0,0.7)';
  roundRect(mx-4,my-4,mw+8,mh+8,6);
  X.fill();

  const sx=mw/map.width, sy=mh/map.height;
  for(let y=0;y<map.height;y++) {
    for(let x=0;x<map.width;x++) {
      X.fillStyle=TILE_PAL[map.data[y][x]]||'#3a7d44';
      X.fillRect(mx+x*sx, my+y*sy, Math.ceil(sx), Math.ceil(sy));
    }
  }
  // Player
  X.fillStyle='#ff0';
  X.fillRect(mx+P.x*sx-1, my+P.y*sy-1, 3, 3);
  // NPCs
  X.fillStyle='#f0c040';
  for(const npc of (map.npcs||[])) {
    X.fillRect(mx+npc.x*sx, my+npc.y*sy, 2, 2);
  }
}

// --- Battle System ---
const Battle = {
  active:false, enemy:null, eparty:[], eidx:0, isWild:true, tname:'',
  playerTurn:true, animating:false,
  textQueue:[], currentText:'', textCharIdx:0, textTyping:false, textCb:null,
  menuState:'main', // main, moves, bag, team
  selectedMove:-1,
  shakeTimer:0, shakeTarget:'', flashTimer:0, flashTarget:'',
  hpAnimPlayer:1, hpAnimEnemy:1, // animated hp ratios
  slideInPlayer:0, slideInEnemy:0, // for entrance animations

  startWild(creature) {
    this.active=true; this.enemy=creature;
    this.eparty=[creature]; this.eidx=0; this.isWild=true;
    this.tname=''; this.playerTurn=true; this.animating=false;
    this.menuState='main'; this.textQueue=[];
    this.hpAnimEnemy=1; this.hpAnimPlayer = P.party[0].hp/P.party[0].maxHp;
    this.slideInPlayer=-200; this.slideInEnemy=200;
    this.sendOutFirst();
    gameState='battle';
    Audio.stopBgm(); Audio.bgm('battle');
    this.queueText(`A wild ${creature.name} appeared!`);
  },
  startTrainer(creatures, name) {
    this.active=true; this.eparty=creatures; this.eidx=0;
    this.enemy=creatures[0]; this.isWild=false; this.tname=name;
    this.playerTurn=true; this.animating=false; this.menuState='main';
    this.textQueue=[]; this.hpAnimEnemy=1;
    this.hpAnimPlayer = P.party[0].hp/P.party[0].maxHp;
    this.slideInPlayer=-200; this.slideInEnemy=200;
    this.sendOutFirst();
    gameState='battle';
    Audio.stopBgm(); Audio.bgm('battle');
    this.queueText(`${name} wants to battle!`);
    this.queueText(`${name} sent out ${this.enemy.name}!`);
  },
  sendOutFirst() {
    const alive = P.party.findIndex(c=>c.hp>0);
    if (alive>0) { [P.party[0],P.party[alive]]=[P.party[alive],P.party[0]]; }
  },

  queueText(t, cb=null) {
    this.textQueue.push({text:t, cb});
  },
  showNextText() {
    if (this.textQueue.length===0) {
      this.textTyping=false; this.currentText='';
      gameState='battle'; this.menuState='main';
      return;
    }
    const item = this.textQueue.shift();
    this.currentText=''; this.textCharIdx=0; this.textTyping=true;
    this._fullText = item.text; this.textCb = item.cb;
    gameState='battleText';
  },

  advanceText() {
    if (this.textTyping && this.textCharIdx < this._fullText.length) {
      this.currentText = this._fullText;
      this.textCharIdx = this._fullText.length;
      this.textTyping = false;
      return;
    }
    const cb = this.textCb; this.textCb = null;
    if (cb) cb();
    this.showNextText();
  },

  update() {
    // Animate HP bars
    const p = P.party[0];
    if (p) {
      const targetP = Math.max(0, p.hp/p.maxHp);
      this.hpAnimPlayer += (targetP - this.hpAnimPlayer) * 0.1;
    }
    if (this.enemy) {
      const targetE = Math.max(0, this.enemy.hp/this.enemy.maxHp);
      this.hpAnimEnemy += (targetE - this.hpAnimEnemy) * 0.1;
    }
    // Slide in animations
    if (this.slideInPlayer < 0) this.slideInPlayer += 8;
    if (this.slideInEnemy > 0) this.slideInEnemy -= 8;
    if (this.slideInPlayer > 0) this.slideInPlayer = 0;
    if (this.slideInEnemy < 0) this.slideInEnemy = 0;
    // Shake
    if (this.shakeTimer > 0) this.shakeTimer--;
    if (this.flashTimer > 0) this.flashTimer--;
    // Text typing
    if (this.textTyping && this.textCharIdx < this._fullText.length) {
      this.textCharIdx += 1;
      this.currentText = this._fullText.substring(0, this.textCharIdx);
      if (this.textCharIdx >= this._fullText.length) this.textTyping = false;
    }
    Particles.update();
  },

  draw() {
    // Battle background
    drawBattleBG();
    // Enemy platform
    X.fillStyle='#6b8f45';
    X.beginPath(); X.ellipse(580+this.slideInEnemy,200,120,30,0,0,Math.PI*2); X.fill();
    X.fillStyle='#7a9f55';
    X.beginPath(); X.ellipse(580+this.slideInEnemy,198,100,22,0,0,Math.PI*2); X.fill();
    // Player platform
    X.fillStyle='#7a9f55';
    X.beginPath(); X.ellipse(200+this.slideInPlayer,380,130,35,0,0,Math.PI*2); X.fill();
    X.fillStyle='#8aaf65';
    X.beginPath(); X.ellipse(200+this.slideInPlayer,378,110,28,0,0,Math.PI*2); X.fill();

    // Enemy sprite
    if (this.enemy) {
      let ex = 530+this.slideInEnemy, ey = 105;
      if (this.shakeTimer>0 && this.shakeTarget==='enemy') {
        ex += Math.sin(this.shakeTimer*2)*8;
      }
      if (this.flashTimer>0 && this.flashTarget==='enemy' && Math.floor(this.flashTimer/3)%2===0) {
        X.globalAlpha=0.3;
      }
      Sprites.draw(this.enemy.sprite, ex, ey, 96, 96);
      X.globalAlpha=1;
    }
    // Player sprite (back view = just larger)
    const p = P.party[0];
    if (p) {
      let px = 150+this.slideInPlayer, py = 240;
      if (this.shakeTimer>0 && this.shakeTarget==='player') {
        px += Math.sin(this.shakeTimer*2)*8;
      }
      if (this.flashTimer>0 && this.flashTarget==='player' && Math.floor(this.flashTimer/3)%2===0) {
        X.globalAlpha=0.3;
      }
      Sprites.draw(p.sprite, px, py, 112, 112);
      X.globalAlpha=1;
    }

    Particles.draw();

    // Enemy info panel
    if (this.enemy) {
      this.drawInfoPanel(this.enemy, 30, 30, this.hpAnimEnemy, false);
    }
    // Player info panel
    if (p) {
      this.drawInfoPanel(p, W-290, 320, this.hpAnimPlayer, true);
    }

    // Battle menu / text
    this.drawBattleMenu();
  },

  drawInfoPanel(c, x, y, hpRatio, showXP) {
    X.fillStyle='rgba(10,10,30,0.9)';
    roundRect(x,y,250,showXP?90:75,10);
    X.fill();
    X.strokeStyle='#e2b340'; X.lineWidth=2;
    roundRect(x,y,250,showXP?90:75,10);
    X.stroke();

    // Name and level
    X.fillStyle='#f0c040'; X.font='bold 16px monospace'; X.textAlign='left';
    X.fillText(c.name, x+12, y+22);
    X.fillStyle='#aaa'; X.font='13px monospace';
    X.fillText(`Lv.${c.level}`, x+180, y+22);
    // Type badge
    X.fillStyle=TYPES[c.type].color;
    roundRect(x+12,y+28,70,16,4); X.fill();
    X.fillStyle='#fff'; X.font='11px monospace'; X.textAlign='center';
    X.fillText(TYPES[c.type].name, x+47, y+40);
    X.textAlign='left';
    // HP bar
    const barX=x+12, barY=y+50, barW=226, barH=14;
    X.fillStyle='#333';
    roundRect(barX,barY,barW,barH,4); X.fill();
    const pct = Math.max(0, Math.min(1, hpRatio));
    const hpColor = pct>0.5?'#4caf50':pct>0.25?'#ff9800':'#f44336';
    if (pct > 0) {
      X.fillStyle=hpColor;
      roundRect(barX,barY,barW*pct,barH,4); X.fill();
      // Shine
      X.fillStyle='rgba(255,255,255,0.15)';
      X.fillRect(barX+2,barY+2,barW*pct-4,barH/2-2);
    }
    X.fillStyle='#ddd'; X.font='11px monospace'; X.textAlign='right';
    X.fillText(`${Math.max(0,c.hp)}/${c.maxHp}`, x+238, y+62);
    X.textAlign='left';
    // XP bar
    if (showXP) {
      X.fillStyle='#222';
      X.fillRect(barX,barY+20,barW,6);
      X.fillStyle='#2196f3';
      X.fillRect(barX,barY+20,barW*(c.xp/c.xpNext),6);
    }
  },

  drawBattleMenu() {
    // Bottom panel
    X.fillStyle='rgba(10,10,30,0.95)';
    X.fillRect(0, H-150, W, 150);
    X.strokeStyle='#e2b340'; X.lineWidth=3;
    X.beginPath(); X.moveTo(0,H-150); X.lineTo(W,H-150); X.stroke();

    if (gameState==='battleText') {
      // Show text
      X.fillStyle='#eee'; X.font='16px monospace'; X.textAlign='left';
      wrapText(this.currentText, 30, H-115, W-60, 24);
      if (!this.textTyping) {
        X.fillStyle=`rgba(255,255,255,${0.5+Math.sin(frame*0.1)*0.5})`;
        X.font='14px monospace'; X.textAlign='right';
        X.fillText('▼ click', W-30, H-15);
      }
      return;
    }

    if (this.menuState==='main') {
      const btns = [
        {label:'FIGHT',color:'#c62828',x:W/2+10,y:H-130},
        {label:'BAG',color:'#2e7d32',x:W/2+170,y:H-130},
        {label:'TEAM',color:'#1565c0',x:W/2+10,y:H-70},
        {label:'RUN',color:'#6a1b9a',x:W/2+170,y:H-70},
      ];
      // Prompt text
      X.fillStyle='#eee'; X.font='16px monospace'; X.textAlign='left';
      X.fillText('What will', 30, H-110);
      X.fillText(`${P.party[0]?.name || '???'} do?`, 30, H-85);

      btns.forEach((b,i) => {
        X.fillStyle=b.color;
        roundRect(b.x,b.y,140,48,8); X.fill();
        // Hover-like highlight border
        X.strokeStyle='rgba(255,255,255,0.3)'; X.lineWidth=2;
        roundRect(b.x,b.y,140,48,8); X.stroke();
        // Shine
        X.fillStyle='rgba(255,255,255,0.1)';
        X.fillRect(b.x+4,b.y+4,132,20);
        X.fillStyle='#fff'; X.font='bold 16px monospace'; X.textAlign='center';
        X.fillText(b.label, b.x+70, b.y+30);
      });
    } else if (this.menuState==='moves') {
      const p = P.party[0]; if(!p) return;
      p.moves.forEach((m,i) => {
        const mx = (i%2)*220 + 30, my = H-135 + Math.floor(i/2)*55;
        X.fillStyle=TYPES[m.type]?TYPES[m.type].color+'33':'#333';
        roundRect(mx,my,200,45,8); X.fill();
        X.strokeStyle=TYPES[m.type]?TYPES[m.type].color:'#555'; X.lineWidth=2;
        roundRect(mx,my,200,45,8); X.stroke();
        X.fillStyle='#eee'; X.font='14px monospace'; X.textAlign='left';
        X.fillText(m.name, mx+10, my+18);
        X.fillStyle=TYPES[m.type]?TYPES[m.type].color:'#888'; X.font='11px monospace';
        X.fillText(`${TYPES[m.type]?.name||'???'} Pow:${m.pow||'-'}`, mx+10, my+34);
        X.fillStyle='#888'; X.textAlign='right';
        X.fillText(`PP:${m.curPP}/${m.pp}`, mx+190, my+34);
      });
      // Back button
      X.fillStyle='#444';
      roundRect(500,H-80,120,40,8); X.fill();
      X.fillStyle='#eee'; X.font='14px monospace'; X.textAlign='center';
      X.fillText('← BACK', 560, H-55);
    } else if (this.menuState==='bag') {
      const items = P.bag.filter(i=>i.count>0);
      items.forEach((item,i) => {
        const iy = H-140 + i*28;
        X.fillStyle=i%2===0?'rgba(255,255,255,0.05)':'rgba(0,0,0,0.1)';
        X.fillRect(30,iy,W-60,26);
        X.fillStyle='#eee'; X.font='14px monospace'; X.textAlign='left';
        X.fillText(`${item.name}`, 50, iy+18);
        X.fillStyle='#888'; X.textAlign='right';
        X.fillText(`x${item.count}`, W-50, iy+18);
      });
      X.fillStyle='#444'; roundRect(W-160,H-30,120,25,6); X.fill();
      X.fillStyle='#eee'; X.font='12px monospace'; X.textAlign='center';
      X.fillText('← BACK', W-100, H-13);
    } else if (this.menuState==='team') {
      P.party.forEach((c,i) => {
        const cy = H-140+i*24;
        const pct=Math.max(0,c.hp/c.maxHp);
        X.fillStyle=i===0?'rgba(255,255,100,0.1)':'rgba(255,255,255,0.03)';
        X.fillRect(30,cy,W-60,22);
        X.fillStyle=c.hp>0?'#eee':'#666'; X.font='13px monospace'; X.textAlign='left';
        X.fillText(`${c.name} Lv${c.level}`, 50, cy+16);
        X.fillStyle='#333'; X.fillRect(300,cy+5,150,10);
        X.fillStyle=pct>0.5?'#4caf50':pct>0.25?'#ff9800':'#f44336';
        X.fillRect(300,cy+5,150*pct,10);
        X.fillStyle='#aaa'; X.font='11px monospace'; X.textAlign='right';
        X.fillText(`${Math.max(0,c.hp)}/${c.maxHp}`, W-50, cy+16);
      });
      X.fillStyle='#444'; roundRect(W-160,H-30,120,25,6); X.fill();
      X.fillStyle='#eee'; X.font='12px monospace'; X.textAlign='center';
      X.fillText('← BACK', W-100, H-13);
    }
  },

  // Handle clicks
  handleClick(mx, my) {
    if (gameState==='battleText') { this.advanceText(); return; }
    if (!this.playerTurn || this.animating) return;

    if (this.menuState==='main') {
      if (mx>W/2+10&&mx<W/2+150&&my>H-130&&my<H-82) this.showMoves();
      else if (mx>W/2+170&&mx<W/2+310&&my>H-130&&my<H-82) this.showBag();
      else if (mx>W/2+10&&mx<W/2+150&&my>H-70&&my<H-22) this.showTeam();
      else if (mx>W/2+170&&mx<W/2+310&&my>H-70&&my<H-22) this.tryRun();
    } else if (this.menuState==='moves') {
      const p = P.party[0]; if(!p) return;
      for (let i=0;i<p.moves.length;i++) {
        const bx=(i%2)*220+30, by=H-135+Math.floor(i/2)*55;
        if (mx>bx&&mx<bx+200&&my>by&&my<by+45) { this.useMove(i); return; }
      }
      if (mx>500&&mx<620&&my>H-80&&my<H-40) this.menuState='main';
    } else if (this.menuState==='bag') {
      const items=P.bag.filter(i=>i.count>0);
      for (let i=0;i<items.length;i++) {
        const iy=H-140+i*28;
        if (mx>30&&mx<W-30&&my>iy&&my<iy+26) { this.useItem(items[i]); return; }
      }
      if (mx>W-160&&mx<W-40&&my>H-30&&my<H-5) this.menuState='main';
    } else if (this.menuState==='team') {
      for (let i=0;i<P.party.length;i++) {
        const cy=H-140+i*24;
        if (mx>30&&mx<W-30&&my>cy&&my<cy+22) { this.switchTo(i); return; }
      }
      if (mx>W-160&&mx<W-40&&my>H-30&&my<H-5) this.menuState='main';
    }
  },

  showMoves() { Audio.jingle('select'); this.menuState='moves'; },
  showBag() { Audio.jingle('select'); this.menuState='bag'; },
  showTeam() { Audio.jingle('select'); this.menuState='team'; },

  switchTo(i) {
    if (P.party[i].hp<=0||i===0) return;
    this.playerTurn=false;
    [P.party[0],P.party[i]]=[P.party[i],P.party[0]];
    this.menuState='main';
    this.queueText(`Go, ${P.party[0].name}!`, () => { this.enemyTurn(); });
    this.showNextText();
  },

  useItem(item) {
    if (item.fx==='heal') {
      const c=P.party[0];
      if (c.hp>=c.maxHp) return;
      c.hp=Math.min(c.maxHp, c.hp+item.val);
      item.count--;
      this.playerTurn=false; this.menuState='main';
      Audio.jingle('heal');
      this.queueText(`Used ${item.name}! Recovered HP!`, () => { this.enemyTurn(); });
      this.showNextText();
    } else if (item.fx==='catch') {
      if (!this.isWild) return;
      item.count--;
      this.playerTurn=false; this.menuState='main';
      this.tryCatch(item.val);
    } else if (item.fx==='revive') {
      const f=P.party.find(c=>c.hp<=0);
      if (!f) return;
      f.hp=Math.floor(f.maxHp/2);
      item.count--;
      this.playerTurn=false; this.menuState='main';
      Audio.jingle('heal');
      this.queueText(`${f.name} was revived!`, () => { this.enemyTurn(); });
      this.showNextText();
    }
  },

  useMove(idx) {
    const p=P.party[0], move=p.moves[idx];
    if (!move||move.curPP<=0) return;
    this.playerTurn=false; this.menuState='main';
    move.curPP--;

    const pSpd=p.spd*(1+p.mods.spd*0.25);
    const eSpd=this.enemy.spd*(1+(this.enemy.mods?.spd||0)*0.25);

    if (pSpd>=eSpd) {
      this.execMove(p,this.enemy,move,'player',() => {
        if (this.enemy.hp<=0) { this.enemyFainted(); return; }
        this.enemyTurn();
      });
    } else {
      this.enemyTurnFirst(() => {
        if (P.party[0].hp<=0) { this.playerFainted(); return; }
        this.execMove(p,this.enemy,move,'player',() => {
          if (this.enemy.hp<=0) { this.enemyFainted(); return; }
          this.playerTurn=true;
        });
      });
    }
    this.showNextText();
  },

  execMove(atk,def,move,who,cb) {
    // Accuracy
    if (Math.random()*100 > move.acc) {
      Audio.jingle('miss');
      this.queueText(`${atk.name} used ${move.name}... but missed!`, cb);
      return;
    }
    // Status moves
    if (move.pow===0 && move.fx) {
      this.applyFx(atk,def,move,who,cb);
      return;
    }
    // Damage calc
    const aStat=atk.atk*(1+(atk.mods?.atk||0)*0.25);
    const dStat=def.def*(1+(def.mods?.def||0)*0.25);
    const eff=typeEffect(move.type, def.type);
    const stab=move.type===atk.type?1.5:1;
    const rand=0.85+Math.random()*0.15;
    let dmg=Math.floor(((2*atk.level/5+2)*move.pow*aStat/dStat/50+2)*stab*eff*rand);
    if (move.fx==='double') dmg=Math.floor(dmg*1.5);
    let crit=false;
    if (Math.random()<0.0625) { dmg=Math.floor(dmg*1.5); crit=true; }
    if (dmg<1) dmg=1;
    def.hp=Math.max(0,def.hp-dmg);

    // VFX
    const target=who==='player'?'enemy':'player';
    this.shakeTimer=15; this.shakeTarget=target;
    this.flashTimer=20; this.flashTarget=target;
    const pColor=TYPES[move.type]?TYPES[move.type].color:'#fff';
    const pTarget=target==='enemy'?{x:580,y:150}:{x:200,y:300};
    Particles.spawn(pTarget.x,pTarget.y,15,pColor,4,25,5);
    if (eff>1) { Audio.jingle('superHit'); Particles.spawn(pTarget.x,pTarget.y,20,'#ff0',5,30,6); }
    else Audio.jingle('hit');

    let msg=`${atk.name} used ${move.name}! `;
    if (eff>1) msg+="Super effective! ";
    else if (eff<1) msg+="Not very effective... ";
    if (crit) msg+="Critical hit! ";
    msg+=`(-${dmg} HP)`;

    this.queueText(msg, cb);
  },

  applyFx(atk,def,move,who,cb) {
    let msg=`${atk.name} used ${move.name}! `;
    const fx=move.fx;
    if (fx==='heal') {
      const amt=Math.floor(atk.maxHp*0.35);
      atk.hp=Math.min(atk.maxHp,atk.hp+amt);
      msg+=`Restored ${amt} HP!`;
      Audio.jingle('heal');
    } else if (fx==='atkUp') {
      atk.mods.atk=Math.min(3,(atk.mods?.atk||0)+1);
      msg+='Attack rose!';
      Particles.spawn(who==='player'?200:580, who==='player'?300:150, 8, '#f44', 3, 20);
    } else if (fx==='atkUpBig') {
      atk.mods.atk=Math.min(3,(atk.mods?.atk||0)+2);
      msg+='Attack rose sharply!';
      Particles.spawn(who==='player'?200:580, who==='player'?300:150, 15, '#f44', 4, 25);
    } else if (fx==='defUp') {
      atk.mods.def=Math.min(3,(atk.mods?.def||0)+1);
      msg+='Defense rose!';
    } else if (fx==='allUp') {
      atk.mods.atk=Math.min(3,(atk.mods?.atk||0)+1);
      atk.mods.def=Math.min(3,(atk.mods?.def||0)+1);
      atk.mods.spd=Math.min(3,(atk.mods?.spd||0)+1);
      msg+='All stats rose!';
      Particles.spawn(who==='player'?200:580, who==='player'?300:150, 20, '#0ff', 4, 25);
    } else if (fx==='eAtkDown') {
      def.mods=def.mods||{atk:0,def:0,spd:0};
      def.mods.atk=Math.max(-3,def.mods.atk-1);
      msg+=`${def.name}'s attack fell!`;
    } else if (fx==='eSpdDown') {
      def.mods=def.mods||{atk:0,def:0,spd:0};
      def.mods.spd=Math.max(-3,def.mods.spd-1);
      msg+=`${def.name}'s speed fell!`;
    }
    this.queueText(msg, cb);
  },

  enemyTurn(cb) {
    const e=this.enemy, p=P.party[0];
    if (!e||e.hp<=0||!p||p.hp<=0) { if(cb)cb(); else{this.playerTurn=true;} return; }
    const valid=e.moves.filter(m=>m.curPP>0);
    if (valid.length===0) {
      this.queueText(`${e.name} struggles!`, () => {
        e.hp=Math.max(0,e.hp-Math.floor(e.maxHp*0.1));
        if (e.hp<=0) { this.enemyFainted(); return; }
        if(cb)cb();else{this.playerTurn=true;}
      });
      this.showNextText();
      return;
    }
    // AI
    let best=valid[0], bestS=-1;
    for (const m of valid) {
      let s=m.pow||30;
      s*=typeEffect(m.type,p.type);
      if (m.type===e.type) s*=1.3;
      if (m.fx==='heal'&&e.hp<e.maxHp*0.4) s=80;
      s+=Math.random()*15;
      if (s>bestS){bestS=s;best=m;}
    }
    best.curPP--;
    this.execMove(e,p,best,'enemy',() => {
      if (p.hp<=0){this.playerFainted();return;}
      if(cb)cb();else{this.playerTurn=true;}
    });
    this.showNextText();
  },
  enemyTurnFirst(cb) {
    // Enemy goes first, then callback
    this.enemyTurn(cb);
  },

  enemyFainted() {
    const p=P.party[0];
    const xpGain=Math.floor(this.enemy.level*8+10);
    p.xp+=xpGain;
    let msg=`${this.enemy.name} fainted! +${xpGain} XP!`;
    // Level up chain
    while (p.xp>=p.xpNext) {
      p.xp-=p.xpNext; p.level++;
      calcStats(p); p.hp=Math.min(p.hp+15,p.maxHp);
      msg+=` Level ${p.level}!`;
      Audio.jingle('levelUp');
      // New move?
      const def=CREATURES[p.id];
      if (def) {
        const mi=Math.min(3,Math.floor(p.level/5)+1);
        if (def.moves[mi]&&!p.moves.find(m=>m.id===def.moves[mi])) {
          const nm=MOVES[def.moves[mi]];
          if (nm) {
            if (p.moves.length<4) {
              p.moves.push({...nm,id:def.moves[mi],curPP:nm.pp});
              msg+=` Learned ${nm.name}!`;
            }
          }
        }
      }
      // Evolution?
      if (p.evoDef&&p.level>=p.evoDef.level) {
        const ed=CREATURES[p.evoDef.into];
        if (ed) {
          const old=p.name;
          p.id=p.evoDef.into; p.name=ed.name; p.sprite=ed.sprite;
          p.type=ed.type; p.base={...ed.base}; p.desc=ed.desc;
          p.evoDef=ed.evo; calcStats(p); p.hp=p.maxHp;
          for (const mid of ed.moves) {
            if (!p.moves.find(m=>m.id===mid)&&p.moves.length<4) {
              const mv=MOVES[mid]; if(mv) p.moves.push({...mv,id:mid,curPP:mv.pp});
            }
          }
          msg+=` ${old} evolved into ${p.name}!!`;
          Audio.jingle('evolve');
          Particles.spawn(200,300,40,'#ff0',6,40,8);
        }
      }
    }
    this.queueText(msg, () => {
      if (!this.isWild) {
        this.eidx++;
        if (this.eidx<this.eparty.length) {
          this.enemy=this.eparty[this.eidx];
          this.hpAnimEnemy=1; this.slideInEnemy=200;
          this.queueText(`${this.tname} sent out ${this.enemy.name}!`, () => {this.playerTurn=true;});
          this.showNextText();
          return;
        } else {
          P.defeated.push(this.tname);
          const prize=this.eparty.length*100;
          P.money+=prize;
          Audio.jingle('victory');
          this.queueText(`Defeated ${this.tname}! Won $${prize}!`, () => {this.end();});
          this.showNextText();
          return;
        }
      }
      Audio.jingle('victory');
      this.end();
    });
    this.showNextText();
  },

  playerFainted() {
    const next=P.party.findIndex(c=>c.hp>0);
    if (next>=0) {
      this.queueText(`${P.party[0].name} fainted!`, () => {
        [P.party[0],P.party[next]]=[P.party[next],P.party[0]];
        this.slideInPlayer=-200;
        this.queueText(`Go, ${P.party[0].name}!`, () => {this.playerTurn=true;});
        this.showNextText();
      });
      this.showNextText();
    } else {
      this.queueText('All creatures fainted! You blacked out...', () => {
        P.party.forEach(c=>{c.hp=c.maxHp;c.moves.forEach(m=>m.curPP=m.pp);c.mods={atk:0,def:0,spd:0};});
        P.x=15;P.y=13;P.px=P.x*TS;P.py=P.y*TS;P.mapId='hometown';
        this.end();
      });
      this.showNextText();
    }
  },

  tryRun() {
    if (!this.isWild) {
      this.queueText("Can't run from a trainer!"); this.showNextText(); return;
    }
    Audio.jingle('run');
    const p=P.party[0], e=this.enemy;
    if (Math.random()<0.6 + p.spd/(p.spd+e.spd)*0.3) {
      this.queueText('Got away safely!', () => {this.end();}); this.showNextText();
    } else {
      this.playerTurn=false;
      this.queueText("Couldn't escape!", () => {this.enemyTurn();}); this.showNextText();
    }
  },

  tryCatch(bonus) {
    const e=this.enemy;
    const hpFactor=(1-e.hp/e.maxHp)*100;
    const rate=(hpFactor+Math.max(1,50-e.level)+bonus*30)/150;
    let shakes=0;
    const doShake = () => {
      shakes++;
      Audio.jingle('select');
      if (shakes<3) { setTimeout(doShake, 600); return; }
      if (Math.random()<rate) {
        Audio.jingle('catch');
        Particles.spawn(580,150,25,'#ff0',5,30);
        this.queueText(`Caught ${e.name}!`, () => {
          if (P.party.length<6) P.party.push(e);
          this.queueText(`${e.name} joined your team!`, () => {this.end();});
          this.showNextText();
        });
        this.showNextText();
      } else {
        Audio.jingle('catchFail');
        this.queueText(`${e.name} broke free!`, () => {this.enemyTurn();});
        this.showNextText();
      }
    };
    this.queueText('Threw a Manuscript...'); this.showNextText();
    setTimeout(doShake, 600);
  },

  end() {
    this.active=false;
    P.party.forEach(c=>{c.mods={atk:0,def:0,spd:0};});
    gameState='overworld';
    const map=MAPS[P.mapId];
    if (map.music) Audio.bgm(map.music);
  }
};

function drawBattleBG() {
  // Sky gradient
  const grad=X.createLinearGradient(0,0,0,H-150);
  grad.addColorStop(0,'#87CEEB');
  grad.addColorStop(0.6,'#b4e0fa');
  grad.addColorStop(1,'#5a8f3c');
  X.fillStyle=grad;
  X.fillRect(0,0,W,H-150);

  // Clouds
  X.fillStyle='rgba(255,255,255,0.6)';
  [[80+Math.sin(frame*0.005)*20,50],[350+Math.sin(frame*0.007+1)*15,40],[600+Math.sin(frame*0.004+2)*25,60]].forEach(([cx,cy])=>{
    X.beginPath();
    X.arc(cx,cy,25,0,Math.PI*2); X.arc(cx+25,cy-8,20,0,Math.PI*2);
    X.arc(cx-15,cy-5,18,0,Math.PI*2); X.arc(cx+10,cy+5,15,0,Math.PI*2);
    X.fill();
  });

  // Ground
  X.fillStyle='#5a8f3c';
  X.fillRect(0,280,W,H-280-150);
  X.fillStyle='#4a7f2c';
  X.beginPath(); X.arc(180,300,80,Math.PI,0); X.fill();
  X.beginPath(); X.arc(620,290,100,Math.PI,0); X.fill();
  // Grass tufts
  X.fillStyle='#3a6f1c';
  for(let i=0;i<12;i++) {
    const gx=i*70+10+Math.sin(i)*10;
    X.fillRect(gx,350+Math.sin(i*2)*5,4,15);
    X.fillRect(gx+6,355+Math.sin(i*2+1)*3,3,12);
  }
}

function startWildEncounter() {
  if (P.party.length===0||P.party.every(c=>c.hp<=0)) return;
  const map=MAPS[P.mapId];
  const possible=map.encounters||[];
  const cid=possible[Math.floor(Math.random()*possible.length)];
  const maxLv=Math.max(...P.party.map(c=>c.level));
  const lv=Math.max(2,Math.floor(maxLv*(0.6+Math.random()*0.6)));
  const wild=makeCreature(cid,lv);
  EncounterTransition.start(() => { Battle.startWild(wild); });
}

function startTrainerBattle(npc) {
  const creatures=npc.battle.creatures.map(c=>makeCreature(c.id,c.lv||c.level||5));
  EncounterTransition.start(() => { Battle.startTrainer(creatures, npc.name); });
}

// --- Title Screen ---
function drawTitle() {
  // Background
  const grad=X.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#1a0a2e'); grad.addColorStop(0.5,'#16213e'); grad.addColorStop(1,'#0f3460');
  X.fillStyle=grad; X.fillRect(0,0,W,H);

  // Stars
  for (let i=0;i<50;i++) {
    const sx=(i*137+frame*0.2)%W, sy=(i*73)%300;
    X.fillStyle=`rgba(255,255,255,${0.3+Math.sin(frame*0.02+i)*0.3})`;
    X.fillRect(sx,sy,2,2);
  }

  // Title
  X.save();
  X.font='bold 56px monospace'; X.textAlign='center';
  X.fillStyle='#a06000';
  X.fillText('LEXICON LEGENDS', W/2+3, 183);
  X.fillStyle='#f0c040';
  X.fillText('LEXICON LEGENDS', W/2, 180);
  // Glow
  X.shadowColor='#f0c040'; X.shadowBlur=20;
  X.fillText('LEXICON LEGENDS', W/2, 180);
  X.restore();

  X.fillStyle='#88aacc'; X.font='18px monospace'; X.textAlign='center';
  X.fillText('A Literary Creature RPG', W/2, 220);

  // Floating creature previews
  const previews=['metaphor_front','simile_front','hyperbole_front'];
  previews.forEach((s,i) => {
    const ox=200+i*200, oy=300+Math.sin(frame*0.03+i*2)*15;
    Sprites.draw(s, ox-32, oy, 64, 64);
  });

  // Start prompt
  const blink = Math.sin(frame*0.06)>0;
  if (blink) {
    X.fillStyle='#f0c040'; X.font='20px monospace'; X.textAlign='center';
    X.fillText('CLICK TO START', W/2, 500);
  }

  X.fillStyle='#556'; X.font='12px monospace';
  X.fillText('Arrow Keys / WASD to move | SPACE to interact | M for menu', W/2, 560);
  X.fillText('Click buttons in battle', W/2, 578);
}

// --- Starter Selection ---
function drawStarterSelect() {
  const grad=X.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#1a0a2e'); grad.addColorStop(1,'#0f3460');
  X.fillStyle=grad; X.fillRect(0,0,W,H);

  X.fillStyle='#f0c040'; X.font='bold 28px monospace'; X.textAlign='center';
  X.fillText('Choose Your Starter!', W/2, 60);

  const starters = [
    {id:'metaphor',x:100,desc:'Rhetoric Type\nHigh Attack\nShapeshifter of meaning'},
    {id:'simile',x:310,desc:'Poetic Type\nBalanced Stats\nGentle but versatile'},
    {id:'hyperbole',x:520,desc:'Dramatic Type\nGlass Cannon\nTHE STRONGEST (maybe)'},
  ];

  starters.forEach((s,i) => {
    const def=CREATURES[s.id];
    const hover = starterHover===i;
    const y = 100;

    // Card
    X.fillStyle=hover?'rgba(240,192,64,0.15)':'rgba(255,255,255,0.05)';
    roundRect(s.x, y, 180, 380, 12); X.fill();
    X.strokeStyle=hover?'#f0c040':TYPES[def.type].color; X.lineWidth=hover?3:2;
    roundRect(s.x, y, 180, 380, 12); X.stroke();

    // Sprite
    Sprites.draw(def.sprite, s.x+42, y+30, 96, 96);

    // Name
    X.fillStyle='#f0c040'; X.font='bold 18px monospace'; X.textAlign='center';
    X.fillText(def.name, s.x+90, y+150);

    // Type
    X.fillStyle=TYPES[def.type].color; X.font='14px monospace';
    X.fillText(TYPES[def.type].name, s.x+90, y+175);

    // Stats
    X.fillStyle='#aaa'; X.font='12px monospace';
    X.fillText(`HP:${def.base.hp} ATK:${def.base.atk}`, s.x+90, y+205);
    X.fillText(`DEF:${def.base.def} SPD:${def.base.spd}`, s.x+90, y+225);

    // Description
    X.fillStyle='#888'; X.font='11px monospace';
    const lines = s.desc.split('\n');
    lines.forEach((line,li) => {
      X.fillText(line, s.x+90, y+260+li*16);
    });

    // Desc from creature
    X.fillStyle='#666'; X.font='italic 10px monospace';
    wrapText(def.desc, s.x+15, y+330, 150, 14);
  });
}

let starterHover = -1;

function handleStarterClick(mx, my) {
  const starters = [{id:'metaphor',x:100},{id:'simile',x:310},{id:'hyperbole',x:520}];
  for (let i=0;i<starters.length;i++) {
    if (mx>starters[i].x&&mx<starters[i].x+180&&my>100&&my<480) {
      Audio.jingle('select');
      const c=makeCreature(starters[i].id, 5);
      P.party.push(c);
      gameState='dialogue';
      Dialogue.start([
        {s:'Prof. Narrator',t:`Excellent choice! ${c.name} will serve you well!`},
        {s:'Prof. Narrator',t:'Explore the tall grass to find creatures, battle trainers, and grow stronger!'},
        {s:'Prof. Narrator',t:'Head east to Route 1 when ready. Step on red crosses to heal!'},
        {s:'Prof. Narrator',t:'Press M to open the menu. Good luck, Lexicographer!'},
      ]);
      Audio.bgm('town');
      return;
    }
  }
}

function handleStarterHover(mx, my) {
  starterHover=-1;
  const xs=[100,310,520];
  for(let i=0;i<3;i++) {
    if (mx>xs[i]&&mx<xs[i]+180&&my>100&&my<480) { starterHover=i; return; }
  }
}

// --- Menu System (Overworld) ---
const GameMenu = {
  open:false,
  screen:null, // null, 'party', 'bag'
  toggle() {
    if (gameState!=='overworld') return;
    this.open=!this.open;
    this.screen=null;
    if (this.open) { gameState='menu'; Audio.jingle('select'); }
    else gameState='overworld';
  },
  close() { this.open=false; this.screen=null; gameState='overworld'; },
  draw() {
    if (this.screen==='party') { this.drawParty(); return; }
    if (this.screen==='bag') { this.drawBag(); return; }

    X.fillStyle='rgba(10,10,30,0.92)';
    roundRect(W/2-120,H/2-140,240,280,12); X.fill();
    X.strokeStyle='#e2b340'; X.lineWidth=3;
    roundRect(W/2-120,H/2-140,240,280,12); X.stroke();

    X.fillStyle='#f0c040'; X.font='bold 22px monospace'; X.textAlign='center';
    X.fillText('MENU', W/2, H/2-105);

    const btns=[
      {label:'Team',y:H/2-80,action:()=>{this.screen='party';}},
      {label:'Bag',y:H/2-30,action:()=>{this.screen='bag';}},
      {label:'Save',y:H/2+20,action:()=>{this.save();}},
      {label:'Close',y:H/2+70,action:()=>{this.close();}},
    ];
    btns.forEach(b => {
      X.fillStyle='rgba(255,255,255,0.05)';
      roundRect(W/2-100,b.y,200,40,8); X.fill();
      X.strokeStyle='#555'; X.lineWidth=1;
      roundRect(W/2-100,b.y,200,40,8); X.stroke();
      X.fillStyle='#eee'; X.font='16px monospace'; X.textAlign='center';
      X.fillText(b.label, W/2, b.y+26);
    });
  },
  drawParty() {
    X.fillStyle='rgba(10,10,30,0.95)';
    roundRect(40,30,W-80,H-60,12); X.fill();
    X.strokeStyle='#e2b340'; X.lineWidth=3;
    roundRect(40,30,W-80,H-60,12); X.stroke();

    X.fillStyle='#f0c040'; X.font='bold 20px monospace'; X.textAlign='left';
    X.fillText('YOUR TEAM', 70, 65);

    P.party.forEach((c,i) => {
      const cy=90+i*75;
      X.fillStyle=i%2===0?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.1)';
      roundRect(60,cy,W-120,65,8); X.fill();

      Sprites.draw(c.sprite, 70, cy+5, 48, 48);

      X.fillStyle='#f0c040'; X.font='bold 15px monospace'; X.textAlign='left';
      X.fillText(c.name, 130, cy+20);
      X.fillStyle='#aaa'; X.font='13px monospace';
      X.fillText(`Lv.${c.level}  ${TYPES[c.type].name}`, 130, cy+38);
      X.fillText(`ATK:${c.atk} DEF:${c.def} SPD:${c.spd}`, 130, cy+55);

      // HP bar
      const barX=420,barW=200,barH=12;
      X.fillStyle='#333'; roundRect(barX,cy+12,barW,barH,4); X.fill();
      const pct=Math.max(0,c.hp/c.maxHp);
      if(pct>0){X.fillStyle=pct>0.5?'#4caf50':pct>0.25?'#ff9800':'#f44336';roundRect(barX,cy+12,barW*pct,barH,4);X.fill();}
      X.fillStyle='#ddd'; X.font='11px monospace'; X.textAlign='right';
      X.fillText(`${Math.max(0,c.hp)}/${c.maxHp}`, barX+barW, cy+44);

      // XP
      X.fillStyle='#222'; X.fillRect(barX,cy+30,barW,5);
      X.fillStyle='#2196f3'; X.fillRect(barX,cy+30,barW*(c.xp/c.xpNext),5);
      X.textAlign='right'; X.fillStyle='#888'; X.font='10px monospace';
      X.fillText(`XP:${c.xp}/${c.xpNext}`, barX+barW, cy+56);

      // Moves
      X.textAlign='left'; X.fillStyle='#666'; X.font='10px monospace';
      X.fillText(c.moves.map(m=>m.name).join(', '), 340, cy+55);
    });

    // Back
    X.fillStyle='#444'; roundRect(60,H-65,100,30,6); X.fill();
    X.fillStyle='#eee'; X.font='13px monospace'; X.textAlign='center';
    X.fillText('← Back', 110, H-45);
  },
  drawBag() {
    X.fillStyle='rgba(10,10,30,0.95)';
    roundRect(40,30,W-80,H-60,12); X.fill();
    X.strokeStyle='#e2b340'; X.lineWidth=3;
    roundRect(40,30,W-80,H-60,12); X.stroke();

    X.fillStyle='#f0c040'; X.font='bold 20px monospace'; X.textAlign='left';
    X.fillText('YOUR BAG', 70, 65);
    X.fillStyle='#888'; X.font='13px monospace';
    X.fillText(`$${P.money}`, 250, 65);

    const items=P.bag.filter(i=>i.count>0);
    items.forEach((item,i) => {
      const iy=90+i*50;
      X.fillStyle=i%2===0?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.1)';
      roundRect(60,iy,W-120,42,6); X.fill();
      X.fillStyle='#eee'; X.font='15px monospace'; X.textAlign='left';
      X.fillText(item.name, 80, iy+18);
      X.fillStyle='#888'; X.font='12px monospace';
      X.fillText(item.desc, 80, iy+34);
      X.fillStyle='#f0c040'; X.textAlign='right'; X.font='14px monospace';
      X.fillText(`x${item.count}`, W-80, iy+25);
    });
    // Use items in overworld
    items.forEach((item,i) => {
      const iy=90+i*50;
      X.fillStyle='#2e7d32'; roundRect(W-180,iy+8,60,26,4); X.fill();
      X.fillStyle='#fff'; X.font='11px monospace'; X.textAlign='center';
      X.fillText('USE', W-150, iy+26);
    });

    X.fillStyle='#444'; roundRect(60,H-65,100,30,6); X.fill();
    X.fillStyle='#eee'; X.font='13px monospace'; X.textAlign='center';
    X.fillText('← Back', 110, H-45);
  },
  save() {
    try {
      localStorage.setItem('lexicon_save', JSON.stringify({
        p:{x:P.x,y:P.y,mapId:P.mapId,bag:P.bag,defeated:P.defeated,money:P.money},
        party:P.party.map(c=>({id:c.id,level:c.level,hp:c.hp,xp:c.xp,moves:c.moves.map(m=>({id:m.id,curPP:m.curPP}))}))
      }));
      Notification.show('Game saved!');
    } catch(e) { Notification.show('Save failed!'); }
    this.close();
  },
  handleClick(mx, my) {
    if (this.screen==='party') {
      if (mx>60&&mx<160&&my>H-65&&my<H-35) { this.screen=null; return; }
      return;
    }
    if (this.screen==='bag') {
      if (mx>60&&mx<160&&my>H-65&&my<H-35) { this.screen=null; return; }
      // Use items
      const items=P.bag.filter(i=>i.count>0);
      for(let i=0;i<items.length;i++) {
        const iy=90+i*50;
        if (mx>W-180&&mx<W-120&&my>iy+8&&my<iy+34) {
          const item=items[i];
          if (item.fx==='heal') {
            const c=P.party.find(p=>p.hp<p.maxHp&&p.hp>0);
            if(c){c.hp=Math.min(c.maxHp,c.hp+item.val);item.count--;Audio.jingle('heal');Notification.show(`${c.name} healed!`);}
          } else if (item.fx==='revive') {
            const f=P.party.find(c=>c.hp<=0);
            if(f){f.hp=Math.floor(f.maxHp/2);item.count--;Audio.jingle('heal');Notification.show(`${f.name} revived!`);}
          }
          return;
        }
      }
      return;
    }
    // Main menu buttons
    const btns=[{y:H/2-80},{y:H/2-30},{y:H/2+20},{y:H/2+70}];
    for(let i=0;i<btns.length;i++) {
      if (mx>W/2-100&&mx<W/2+100&&my>btns[i].y&&my<btns[i].y+40) {
        Audio.jingle('select');
        if(i===0) this.screen='party';
        else if(i===1) this.screen='bag';
        else if(i===2) this.save();
        else this.close();
        return;
      }
    }
  }
};

// --- Click Handler ---
C.addEventListener('click', (e) => {
  const rect = C.getBoundingClientRect();
  const scaleX = W / rect.width, scaleY = H / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top) * scaleY;

  if (gameState==='title') {
    Audio.init();
    gameState='starterSelect';
    Audio.jingle('start');
  } else if (gameState==='starterSelect') {
    handleStarterClick(mx, my);
  } else if (gameState==='dialogue') {
    Dialogue.advance();
  } else if (gameState==='battleText') {
    Battle.advanceText();
  } else if (gameState==='battle') {
    Battle.handleClick(mx, my);
  } else if (gameState==='menu') {
    GameMenu.handleClick(mx, my);
  }
});

C.addEventListener('mousemove', (e) => {
  const rect = C.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  const my = (e.clientY - rect.top) * (H / rect.height);
  if (gameState==='starterSelect') handleStarterHover(mx, my);
});

// --- Main Game Loop ---
function gameLoop(time) {
  requestAnimationFrame(gameLoop);
  frame++;
  keysJust = {};

  // Overworld movement (continuous key reading)
  if (gameState==='overworld') {
    updatePlayer();
  }

  // Updates
  Transition.update();
  EncounterTransition.update();
  Notification.update();
  if (gameState==='dialogue') Dialogue.update();
  if (gameState==='battle'||gameState==='battleText') Battle.update();

  // Render
  X.fillStyle='#000'; X.fillRect(0,0,W,H);

  if (gameState==='title') {
    drawTitle();
  } else if (gameState==='starterSelect') {
    drawStarterSelect();
  } else if (gameState==='overworld'||gameState==='dialogue'||gameState==='menu') {
    drawOverworld();
    if (gameState==='dialogue') Dialogue.draw();
    if (gameState==='menu') GameMenu.draw();
  } else if (gameState==='battle'||gameState==='battleText') {
    Battle.draw();
  }

  // Overlays
  Particles.draw();
  Transition.draw();
  EncounterTransition.draw();
  Notification.draw();
}

// --- Load Save ---
function tryLoadSave() {
  try {
    const s=JSON.parse(localStorage.getItem('lexicon_save'));
    if (s&&s.party&&s.party.length>0) {
      P.x=s.p.x; P.y=s.p.y; P.px=P.x*TS; P.py=P.y*TS;
      P.mapId=s.p.mapId; P.bag=s.p.bag; P.defeated=s.p.defeated||[];
      P.money=s.p.money||500;
      P.party=s.party.map(c=>{
        const cr=makeCreature(c.id,c.level);
        cr.hp=c.hp; cr.xp=c.xp;
        cr.moves=c.moves.map(m=>{const d=MOVES[m.id];return{...d,id:m.id,curPP:m.curPP};});
        return cr;
      });
      return true;
    }
  } catch(e) {}
  return false;
}

// --- Init ---
requestAnimationFrame(gameLoop);

</script>
