// === TYPE SYSTEM ===
const TYPES={
  rhetoric:{name:'Rhetoric',color:'#e74c3c',strong:['poetic','gothic'],weak:['narrative','satirical']},
  narrative:{name:'Narrative',color:'#3498db',strong:['rhetoric','dramatic'],weak:['poetic','gothic']},
  poetic:{name:'Poetic',color:'#2ecc71',strong:['narrative','satirical'],weak:['rhetoric','dramatic']},
  dramatic:{name:'Dramatic',color:'#f39c12',strong:['poetic','gothic'],weak:['narrative','satirical']},
  satirical:{name:'Satirical',color:'#9b59b6',strong:['rhetoric','dramatic'],weak:['poetic','gothic']},
  gothic:{name:'Gothic',color:'#636e72',strong:['narrative','satirical'],weak:['rhetoric','dramatic']},
};
function typeEff(a,d){if(TYPES[a].strong.includes(d))return 2;if(TYPES[a].weak.includes(d))return .5;return 1}

// === PARTICLES ===
const Particles={
  list:[],
  spawn(x,y,n,col,spd=3,life=30,sz=4,shape='square'){
    for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=Math.random()*spd+1;
    this.list.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life,maxLife:life,color:col,size:Math.random()*sz+1,shape})}},
  stream(x,y,n,col,dx,dy,life=25,sz=3){
    for(let i=0;i<n;i++)this.list.push({x:x+Math.random()*20-10,y:y+Math.random()*10-5,vx:dx+Math.random()*.5-.25,vy:dy+Math.random()*.5-.25,life,maxLife:life,color:col,size:Math.random()*sz+1,shape:'circle'})},
  update(){for(let i=this.list.length-1;i>=0;i--){const p=this.list[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.life--;if(p.life<=0)this.list.splice(i,1)}},
  draw(){for(const p of this.list){X.globalAlpha=p.life/p.maxLife;X.fillStyle=p.color;
    if(p.shape==='circle'){X.beginPath();X.arc(p.x,p.y,p.size,0,Math.PI*2);X.fill()}
    else if(p.shape==='star'){drawStar(p.x,p.y,p.size)}
    else{X.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size)}}X.globalAlpha=1}
};
function drawStar(cx,cy,r){X.beginPath();for(let i=0;i<5;i++){const a=i*Math.PI*2/5-Math.PI/2;X.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);const a2=a+Math.PI/5;X.lineTo(cx+Math.cos(a2)*r*.4,cy+Math.sin(a2)*r*.4)}X.closePath();X.fill()}

// === MOVE VFX ===
const MoveVFX={
  active:false,timer:0,type:'',tx:0,ty:0,cb:null,
  play(type,x,y,cb){this.active=true;this.timer=0;this.type=type;this.tx=x;this.ty=y;this.cb=cb},
  update(){
    if(!this.active)return;
    this.timer++;
    const t=this.timer,x=this.tx,y=this.ty;
    if(t===1){
      const cols={rhetoric:['#ff4422','#ff8844','#ffaa00'],narrative:['#2288ff','#44aaff','#88ccff'],poetic:['#22cc44','#88ff44','#ccff88'],dramatic:['#ffaa00','#ffdd44','#ffffff'],satirical:['#aa44ff','#cc88ff','#ff44ff'],gothic:['#445566','#223344','#112233']};
      const c=cols[this.type]||['#fff','#ddd','#bbb'];
      // Type-specific VFX
      if(this.type==='rhetoric'){
        for(let i=0;i<20;i++)Particles.list.push({x:x+Math.random()*60-30,y:y+20,vx:Math.random()*2-1,vy:-Math.random()*4-2,life:25,maxLife:25,color:c[i%3],size:Math.random()*5+2,shape:'circle'});
      }else if(this.type==='narrative'){
        for(let i=0;i<15;i++)Particles.stream(x-80+i*12,y,1,c[i%3],3,-0.5,20,4);
      }else if(this.type==='poetic'){
        for(let i=0;i<18;i++){const a=Math.random()*Math.PI*2;Particles.list.push({x:x+Math.cos(a)*30,y:y+Math.sin(a)*30,vx:Math.cos(a+1)*2,vy:Math.sin(a+1)*2-1,life:30,maxLife:30,color:c[i%3],size:Math.random()*4+2,shape:'star'})}
      }else if(this.type==='dramatic'){
        for(let i=0;i<12;i++){const lx=x+Math.random()*40-20;Particles.list.push({x:lx,y:y-60,vx:Math.random()*2-1,vy:6+Math.random()*3,life:12,maxLife:12,color:c[i%3],size:Math.random()*3+1,shape:'square'})}
      }else if(this.type==='satirical'){
        for(let i=0;i<16;i++){const a=i*Math.PI*2/16+frame*.1;Particles.list.push({x:x+Math.cos(a)*25,y:y+Math.sin(a)*25,vx:Math.cos(a)*1.5,vy:Math.sin(a)*1.5,life:22,maxLife:22,color:c[i%3],size:3,shape:'circle'})}
      }else if(this.type==='gothic'){
        for(let i=0;i<20;i++)Particles.list.push({x:x+Math.random()*80-40,y:y+Math.random()*60-30,vx:Math.random()-.5,vy:Math.random()-.5,life:30,maxLife:30,color:c[i%3],size:Math.random()*8+3,shape:'square'});
      }else{
        Particles.spawn(x,y,15,'#fff',3,20,4);
      }
    }
    if(t>=25){this.active=false;if(this.cb)this.cb()}
  },
  draw(){} // particles handle drawing
};

    const rows=d.map(r=>r.split(''));
    const ph=rows.length,pw=rows[0].length;
    const sx=w/pw,sy=h/ph;
    X.save();
    if(flip){X.translate(x+w,y);X.scale(-1,1);x=0;y=0}
    for(let py=0;py<ph;py++)for(let px=0;px<pw;px++){
      const ch=rows[py][px];if(ch==='.')continue;
      const col=this.C[ch];if(!col)continue;
      X.fillStyle=col;X.fillRect(Math.floor(x+px*sx),Math.floor(y+py*sy),Math.ceil(sx),Math.ceil(sy));
    }
    X.restore();
  }

// === UTILITIES ===
function roundRect(x,y,w,h,r){X.beginPath();X.moveTo(x+r,y);X.lineTo(x+w-r,y);X.quadraticCurveTo(x+w,y,x+w,y+r);X.lineTo(x+w,y+h-r);X.quadraticCurveTo(x+w,y+h,x+w-r,y+h);X.lineTo(x+r,y+h);X.quadraticCurveTo(x,y+h,x,y+h-r);X.lineTo(x,y+r);X.quadraticCurveTo(x,y,x+r,y);X.closePath()}
function wrapText(t,x,y,mw,lh){X.textAlign='left';const ws=t.split(' ');let ln='',cy=y;for(const w of ws){const tl=ln+w+' ';if(X.measureText(tl).width>mw&&ln!==''){X.fillText(ln,x,cy);ln=w+' ';cy+=lh}else ln=tl}X.fillText(ln,x,cy)}
function lerp(a,b,t){return a+(b-a)*t}

// === CREATURE FACTORY ===
function makeCreature(id,level){
  const d=CREATURES[id];if(!d)return null;
  const c={id,name:d.name,type:d.type,sprite:d.sprite,level,base:{...d.base},mods:{atk:0,def:0,spd:0,spAtk:0,spDef:0},
    desc:d.desc,evoDef:d.evo,xp:0,status:null,statusTurns:0,moves:[]};
  const avail=d.moves.slice(0,Math.min(4,2+Math.floor(level/5)));
  c.moves=avail.map(mid=>{const m=MOVES[mid];return{...m,id:mid,curPP:m.pp}});
  calcStats(c);c.hp=c.maxHp;return c;
}
function calcStats(c){
  c.maxHp=Math.floor(c.base.hp+c.level*2.5+10);
  c.atk=Math.floor(c.base.atk+c.level*1.5);
  c.def=Math.floor(c.base.def+c.level*1.5);
  c.spd=Math.floor(c.base.spd+c.level*1.5);
  c.spAtk=Math.floor((c.base.spAtk||c.base.atk)+c.level*1.5);
  c.spDef=Math.floor((c.base.spDef||c.base.def)+c.level*1.5);
  c.xpNext=Math.floor(c.level*c.level*1.5+10);
}
function checkEvolve(c){
  if(!c.evoDef||c.level<c.evoDef.level)return false;
  const ed=CREATURES[c.evoDef.into];if(!ed)return false;
  const old=c.name;
  c.id=c.evoDef.into;c.name=ed.name;c.sprite=ed.sprite;c.type=ed.type;
  c.base={...ed.base};c.desc=ed.desc;c.evoDef=ed.evo;
  calcStats(c);c.hp=c.maxHp;
  for(const mid of ed.moves){if(!c.moves.find(m=>m.id===mid)&&c.moves.length<4){const mv=MOVES[mid];if(mv)c.moves.push({...mv,id:mid,curPP:mv.pp})}}
  return old;
}

const MOVE_SPD=3;

function updatePlayer(){
  if(P.moving){
    P.moveProgress+=MOVE_SPD;
    const dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
    const[dx,dy]=dirs[P.moveDir];
    P.px=(P.x+dx*(P.moveProgress/TS))*TS;
    P.py=(P.y+dy*(P.moveProgress/TS))*TS;
    P.walkTimer++;if(P.walkTimer%8===0)P.walkFrame=1-P.walkFrame;
    if(P.moveProgress>=TS){P.x+=dx;P.y+=dy;P.px=P.x*TS;P.py=P.y*TS;P.moving=false;P.moveProgress=0;onStep()}
    return;
  }
  let dx=0,dy=0,dir=null;
  if(keys.ArrowUp||keys.KeyW){dy=-1;dir='up'}
  else if(keys.ArrowDown||keys.KeyS){dy=1;dir='down'}
  else if(keys.ArrowLeft||keys.KeyA){dx=-1;dir='left'}
  else if(keys.ArrowRight||keys.KeyD){dx=1;dir='right'}
  if(!dir){P.walkFrame=0;return}
  P.dir=dir;
  const map=MAPS[P.mapId],nx=P.x+dx,ny=P.y+dy;
  for(const c of(map.conns||[])){if(nx===c.x&&ny===c.y){Trans.start(()=>{P.mapId=c.to;P.x=c.tx;P.y=c.ty;P.px=P.x*TS;P.py=P.y*TS;const m=MAPS[c.to];if(m.music)SFX.bgm(m.music)});return}}
  if(nx<0||ny<0||nx>=map.w||ny>=map.h)return;
  if(!WALK.includes(map.data[ny][nx]))return;
  for(const npc of(map.npcs||[]))if(npc.x===nx&&npc.y===ny)return;
  P.moving=true;P.moveDir=dir;P.moveProgress=0;
  if(frame%3===0)SFX.j('step');
}

function onStep(){
  const map=MAPS[P.mapId],tile=map.data[P.y][P.x];
  if(tile===T.TG&&Math.random()<(map.eRate||.12))startWild();
  if(tile===T.HL){P.party.forEach(c=>{c.hp=c.maxHp;c.status=null;c.statusTurns=0;c.moves.forEach(m=>m.curPP=m.pp)});SFX.j('heal');Notif.show('Team healed!')}
  if(tile===T.SH){Shop.open()}
}

function interact(){
  const map=MAPS[P.mapId],dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
  const[dx,dy]=dirs[P.dir],tx=P.x+dx,ty=P.y+dy;
  for(const npc of(map.npcs||[])){
    if(npc.x===tx&&npc.y===ty){
      if(npc.gym&&!P.defeated.includes(npc.name)&&npc.battle){
        Dlg.start(npc.dlg,()=>startTrainer(npc));
      }else if(npc.champion&&!P.defeated.includes(npc.name)&&npc.battle){
        Dlg.start(npc.dlg,()=>startTrainer(npc));
      }else if(npc.battle&&!P.defeated.includes(npc.name)){
        Dlg.start(npc.dlg,()=>startTrainer(npc));
      }else if(npc.battle){
        Dlg.start([{s:npc.name,t:'Great battle before!'}]);
      }else{
        Dlg.start(npc.dlg);
      }return;
    }
  }
  for(const s of(map.signs||[]))if(s.x===tx&&s.y===ty){Dlg.start([{s:'Sign',t:s.text}]);return}
}

// === BATTLE SYSTEM ===
const B={
  active:false,enemy:null,eparty:[],eidx:0,isWild:true,tname:'',turn:true,
  menuState:'main',tq:[],curText:'',tci:0,typing:false,_ft:'',tcb:null,
  hpAP:1,hpAE:1,slideP:0,slideE:0,shakeT:0,shakeTgt:'',flashT:0,flashTgt:'',
  gymName:null,isChamp:false,

  startWild(c){this.active=true;this.enemy=c;this.eparty=[c];this.eidx=0;this.isWild=true;this.tname='';this.turn=true;this.menuState='main';this.tq=[];
    this.hpAE=1;this.hpAP=P.party[0].hp/P.party[0].maxHp;this.slideP=-200;this.slideE=200;this.gymName=null;this.isChamp=false;
    this._sendFirst();gameState='battle';SFX.stopBgm();SFX.bgm('battle');
    P.lexLog.add(c.id);
    this.qt(`A wild ${c.name} appeared!`)},
  startTrainer(creatures,name,gym,champ){
    this.active=true;this.eparty=creatures;this.eidx=0;this.enemy=creatures[0];this.isWild=false;this.tname=name;
    this.turn=true;this.menuState='main';this.tq=[];this.hpAE=1;this.hpAP=P.party[0].hp/P.party[0].maxHp;
    this.slideP=-200;this.slideE=200;this.gymName=gym||null;this.isChamp=champ||false;
    this._sendFirst();gameState='battle';SFX.stopBgm();SFX.bgm(gym?'gym':'battle');
    creatures.forEach(c=>P.lexLog.add(c.id));
    this.qt(`${name} wants to battle!`);this.qt(`Sent out ${this.enemy.name}!`)},
  _sendFirst(){const a=P.party.findIndex(c=>c.hp>0);if(a>0)[P.party[0],P.party[a]]=[P.party[a],P.party[0]]},

  qt(t,cb=null){this.tq.push({text:t,cb})},
  showNext(){if(!this.tq.length){this.typing=false;this.curText='';gameState='battle';this.menuState='main';return}
    const i=this.tq.shift();this.curText='';this.tci=0;this.typing=true;this._ft=i.text;this.tcb=i.cb;gameState='battleText'},
  advText(){if(this.typing&&this.tci<this._ft.length){this.curText=this._ft;this.tci=this._ft.length;this.typing=false;return}
    const cb=this.tcb;this.tcb=null;if(cb)cb();this.showNext()},

  update(){
    const p=P.party[0];if(p){const t=Math.max(0,p.hp/p.maxHp);this.hpAP+=(t-this.hpAP)*.1}
    if(this.enemy){const t=Math.max(0,this.enemy.hp/this.enemy.maxHp);this.hpAE+=(t-this.hpAE)*.1}
    if(this.slideP<0)this.slideP+=8;if(this.slideE>0)this.slideE-=8;
    if(this.slideP>0)this.slideP=0;if(this.slideE<0)this.slideE=0;
    if(this.shakeT>0)this.shakeT--;if(this.flashT>0)this.flashT--;
    if(this.typing&&this.tci<this._ft.length){this.tci++;this.curText=this._ft.substring(0,this.tci);if(this.tci>=this._ft.length)this.typing=false}
    Particles.update();MoveVFX.update();
  },

  // === STATUS CHECK ===
  checkStatus(c){
    if(!c.status)return true; // can act
    if(c.status==='burn'){const dmg=Math.max(1,Math.floor(c.maxHp/16));c.hp=Math.max(0,c.hp-dmg);this.qt(`${c.name} is burned! (-${dmg})`);SFX.j('status')}
    if(c.status==='poison'){const dmg=Math.max(1,Math.floor(c.maxHp/8));c.hp=Math.max(0,c.hp-dmg);this.qt(`${c.name} is poisoned! (-${dmg})`);SFX.j('status')}
    if(c.status==='freeze'){if(Math.random()<.2){c.status=null;this.qt(`${c.name} thawed out!`);return true}this.qt(`${c.name} is frozen!`);return false}
    if(c.status==='sleep'){c.statusTurns--;if(c.statusTurns<=0){c.status=null;this.qt(`${c.name} woke up!`);return true}this.qt(`${c.name} is asleep!`);return false}
    if(c.status==='paralyze'){if(Math.random()<.25){this.qt(`${c.name} is paralyzed!`);return false}return true}
    if(c.status==='confuse'){if(Math.random()<.33){const dmg=Math.max(1,Math.floor(c.atk*.4));c.hp=Math.max(0,c.hp-dmg);this.qt(`${c.name} hurt itself in confusion! (-${dmg})`);return false}return true}
    return true;
  },

  useMove(idx){
    const p=P.party[0],mv=p.moves[idx];if(!mv||mv.curPP<=0)return;
    this.turn=false;this.menuState='main';mv.curPP--;
    const pSpd=p.spd*(1+p.mods.spd*.25)*(p.status==='paralyze'?.25:1);
    const eSpd=this.enemy.spd*(1+(this.enemy.mods?.spd||0)*.25)*(this.enemy.status==='paralyze'?.25:1);
    if(pSpd>=eSpd){
      this._pTurn(p,mv,()=>{if(this.enemy.hp<=0){this.eFaint();return}this._eTurn()})
    }else{
      this._eTurn(()=>{if(P.party[0].hp<=0){this.pFaint();return}this._pTurn(p,mv,()=>{if(this.enemy.hp<=0){this.eFaint();return}this.turn=true})})
    }
    this.showNext();
  },
  _pTurn(p,mv,cb){
    if(!this.checkStatus(p)){if(p.hp<=0){this.pFaint();return}cb&&cb();return}
    this.execMove(p,this.enemy,mv,'player',cb);
  },
  _eTurn(cb){
    const e=this.enemy,p=P.party[0];
    if(!e||e.hp<=0||!p||p.hp<=0){cb?cb():this.turn=true;return}
    if(!this.checkStatus(e)){if(e.hp<=0){this.eFaint();return}cb?cb():this.turn=true;this.showNext();return}
    const valid=e.moves.filter(m=>m.curPP>0);
    if(!valid.length){this.qt(`${e.name} struggles!`,()=>{e.hp=Math.max(0,e.hp-Math.floor(e.maxHp*.1));if(e.hp<=0){this.eFaint();return}cb?cb():this.turn=true});this.showNext();return}
    // AI
    let best=valid[0],bestS=-1;
    for(const m of valid){let s=m.pow||30;s*=typeEff(m.type,p.type);if(m.type===e.type)s*=1.3;
      if(m.fx&&m.fx.type==='heal'&&e.hp<e.maxHp*.35)s=80;
      if(m.cat==='status'&&m.pow===0&&e.hp>e.maxHp*.5)s*=.6;
      s+=Math.random()*15;if(s>bestS){bestS=s;best=m}}
    best.curPP--;
    this.execMove(e,p,best,'enemy',()=>{if(p.hp<=0){this.pFaint();return}cb?cb():this.turn=true});
    this.showNext();
  },

  execMove(atk,def,mv,who,cb){
    if(Math.random()*100>mv.acc){SFX.j('miss');this.qt(`${atk.name} used ${mv.name}... missed!`,cb);return}
    if(mv.pow===0&&mv.fx){this.applyFx(atk,def,mv,who,cb);return}
    // Damage
    const isSp=mv.cat==='special';
    let aStat=isSp?(atk.spAtk||atk.atk)*(1+(atk.mods?.spAtk||atk.mods?.atk||0)*.25):atk.atk*(1+(atk.mods?.atk||0)*.25);
    if(atk.status==='burn'&&!isSp)aStat*=.5;
    let dStat=isSp?(def.spDef||def.def)*(1+(def.mods?.spDef||def.mods?.def||0)*.25):def.def*(1+(def.mods?.def||0)*.25);
    const eff=typeEff(mv.type,def.type),stab=mv.type===atk.type?1.5:1,rand=.85+Math.random()*.15;
    let dmg=Math.floor(((2*atk.level/5+2)*mv.pow*aStat/dStat/50+2)*stab*eff*rand);
    if(mv.fx&&mv.fx.type==='double')dmg=Math.floor(dmg*1.5);
    let crit=false;if(Math.random()<.0625){dmg=Math.floor(dmg*1.5);crit=true}
    if(dmg<1)dmg=1;
    def.hp=Math.max(0,def.hp-dmg);
    // Recoil
    if(mv.fx&&mv.fx.type==='recoil'){const rc=Math.floor(dmg/3);atk.hp=Math.max(0,atk.hp-rc)}
    // VFX
    const tgt=who==='player'?'enemy':'player';
    this.shakeT=15;this.shakeTgt=tgt;this.flashT=20;this.flashTgt=tgt;
    const px=tgt==='enemy'?580:200,py=tgt==='enemy'?150:300;
    MoveVFX.play(mv.type,px,py,null);
    eff>1?SFX.j('superHit'):SFX.j('hit');
    let msg=`${atk.name} used ${mv.name}! `;
    if(eff>1)msg+="Super effective! ";if(eff<1)msg+="Not very effective... ";if(crit)msg+="Critical! ";
    msg+=`(-${dmg})`;
    // Status infliction
    if(mv.fx&&mv.fx.chance&&!def.status&&def.hp>0){
      if(Math.random()*100<mv.fx.chance){def.status=mv.fx.type;if(mv.fx.type==='sleep')def.statusTurns=1+Math.floor(Math.random()*3);
        msg+=` ${def.name} is now ${mv.fx.type}ed!`;SFX.j('status')}}
    this.qt(msg,cb);
  },

  applyFx(atk,def,mv,who,cb){
    let msg=`${atk.name} used ${mv.name}! `;const fx=mv.fx.type;
    if(fx==='heal'){const a=Math.floor(atk.maxHp*.35);atk.hp=Math.min(atk.maxHp,atk.hp+a);msg+=`+${a} HP!`;SFX.j('heal')}
    else if(fx==='atkUp'){atk.mods.atk=Math.min(3,(atk.mods.atk||0)+1);msg+='ATK rose!';Particles.spawn(who==='player'?200:580,who==='player'?300:150,8,'#f44',3,20)}
    else if(fx==='atkUpBig'){atk.mods.atk=Math.min(3,(atk.mods.atk||0)+2);msg+='ATK sharply rose!';Particles.spawn(who==='player'?200:580,who==='player'?300:150,15,'#f44',4,25)}
    else if(fx==='defUp'){atk.mods.def=Math.min(3,(atk.mods.def||0)+1);msg+='DEF rose!'}
    else if(fx==='allUp'){atk.mods.atk=Math.min(3,(atk.mods.atk||0)+1);atk.mods.def=Math.min(3,(atk.mods.def||0)+1);atk.mods.spd=Math.min(3,(atk.mods.spd||0)+1);msg+='All stats rose!';Particles.spawn(who==='player'?200:580,who==='player'?300:150,20,'#0ff',4,25)}
    else if(fx==='eAtkDown'){def.mods=def.mods||{atk:0,def:0,spd:0};def.mods.atk=Math.max(-3,def.mods.atk-1);msg+=`${def.name}'s ATK fell!`}
    else if(fx==='eSpdDown'){def.mods=def.mods||{atk:0,def:0,spd:0};def.mods.spd=Math.max(-3,def.mods.spd-1);msg+=`${def.name}'s SPD fell!`}
    else if(fx==='sleep'||fx==='paralyze'||fx==='confuse'||fx==='burn'||fx==='freeze'){
      if(!def.status){def.status=fx;if(fx==='sleep')def.statusTurns=1+Math.floor(Math.random()*3);
        msg+=`${def.name} is now ${fx}${fx==='sleep'?'':'ed'}!`;SFX.j('status')}
      else msg+='But it failed!'}
    this.qt(msg,cb);
  },

  eFaint(){
    const p=P.party[0],xp=Math.floor(this.enemy.level*8+15);p.xp+=xp;
    let msg=`${this.enemy.name} fainted! +${xp} XP!`;
    while(p.xp>=p.xpNext){p.xp-=p.xpNext;p.level++;calcStats(p);p.hp=Math.min(p.hp+15,p.maxHp);
      msg+=` Lv${p.level}!`;SFX.j('levelUp');
      const d=CREATURES[p.id];if(d){const mi=Math.min(d.moves.length-1,Math.floor(p.level/5)+1);
        if(d.moves[mi]&&!p.moves.find(m=>m.id===d.moves[mi])){const nm=MOVES[d.moves[mi]];
          if(nm){if(p.moves.length<4){p.moves.push({...nm,id:d.moves[mi],curPP:nm.pp});msg+=` Learned ${nm.name}!`}}}}
      const old=checkEvolve(p);if(old){msg+=` ${old} evolved into ${p.name}!!`;SFX.j('evolve');Particles.spawn(200,300,40,'#ff0',6,40,8)}}
    this.qt(msg,()=>{
      if(!this.isWild){
        this.eidx++;
        if(this.eidx<this.eparty.length){this.enemy=this.eparty[this.eidx];this.hpAE=1;this.slideE=200;
          this.qt(`${this.tname} sent out ${this.enemy.name}!`,()=>{this.turn=true});this.showNext();return}
        P.defeated.push(this.tname);const prize=this.eparty.length*150;P.money+=prize;
        if(this.gymName){P.badges.push(this.gymName);SFX.j('gymWin');
          this.qt(`Defeated Gym Leader ${this.tname}! Got ${this.gymName.toUpperCase()} badge!`,()=>{this.qt(`Won $${prize}!`,()=>{this.end()});this.showNext()})
        }else if(this.isChamp){SFX.j('gymWin');
          this.qt(`YOU DEFEATED THE CHAMPION! You are the greatest Lexicographer!`,()=>{this.qt(`Won $${prize}! Congratulations!`,()=>{this.end()});this.showNext()})
        }else{SFX.j('victory');this.qt(`Defeated ${this.tname}! Won $${prize}!`,()=>{this.end()})}
        this.showNext();return}
      SFX.j('victory');this.end()});
    this.showNext();
  },

  pFaint(){
    const next=P.party.findIndex(c=>c.hp>0);
    if(next>=0){this.qt(`${P.party[0].name} fainted!`,()=>{
      [P.party[0],P.party[next]]=[P.party[next],P.party[0]];this.slideP=-200;
      this.qt(`Go, ${P.party[0].name}!`,()=>{this.turn=true});this.showNext()});this.showNext()
    }else{this.qt('All fainted! Blacked out...',()=>{
      P.party.forEach(c=>{c.hp=c.maxHp;c.status=null;c.statusTurns=0;c.moves.forEach(m=>m.curPP=m.pp);c.mods={atk:0,def:0,spd:0}});
      P.x=15;P.y=13;P.px=P.x*TS;P.py=P.y*TS;P.mapId='hometown';this.end()});this.showNext()}
  },

  tryRun(){if(!this.isWild){this.qt("Can't run from trainer!");this.showNext();return}
    SFX.j('run');if(Math.random()<.6+P.party[0].spd/(P.party[0].spd+this.enemy.spd)*.3){
      this.qt('Got away!',()=>{this.end()});this.showNext()
    }else{this.turn=false;this.qt("Can't escape!",()=>{this._eTurn()});this.showNext()}},

  tryCatch(bonus){const e=this.enemy;const rate=((1-e.hp/e.maxHp)*100+Math.max(1,50-e.level)+bonus*30)/150;
    let shakes=0;
    const doShake=()=>{shakes++;SFX.j('sel');if(shakes<3){setTimeout(doShake,600);return}
      if(Math.random()<rate){SFX.j('catch');Particles.spawn(580,150,25,'#ff0',5,30);
        this.qt(`Caught ${e.name}!`,()=>{if(P.party.length<6)P.party.push(e);this.qt(`${e.name} joined!`,()=>{this.end()});this.showNext()});this.showNext()
      }else{SFX.j('catchFail');this.qt(`${e.name} broke free!`,()=>{this._eTurn()});this.showNext()}};
    this.qt('Threw a Manuscript...');this.showNext();setTimeout(doShake,600)},

  switchTo(i){if(P.party[i].hp<=0||i===0)return;this.turn=false;[P.party[0],P.party[i]]=[P.party[i],P.party[0]];
    this.menuState='main';this.slideP=-200;this.qt(`Go, ${P.party[0].name}!`,()=>{this._eTurn()});this.showNext()},

  useItem(item){
    if(item.fx==='heal'){const c=P.party[0];if(c.hp>=c.maxHp)return;c.hp=Math.min(c.maxHp,c.hp+item.val);item.count--;
      this.turn=false;this.menuState='main';SFX.j('heal');this.qt(`Used ${item.name}! +${item.val} HP!`,()=>{this._eTurn()});this.showNext()
    }else if(item.fx==='catch'){if(!this.isWild)return;item.count--;this.turn=false;this.menuState='main';this.tryCatch(item.val)
    }else if(item.fx==='revive'){const f=P.party.find(c=>c.hp<=0);if(!f)return;f.hp=Math.floor(f.maxHp/2);item.count--;
      this.turn=false;this.menuState='main';SFX.j('heal');this.qt(`${f.name} revived!`,()=>{this._eTurn()});this.showNext()}
  },

  end(){this.active=false;P.party.forEach(c=>{c.mods={atk:0,def:0,spd:0,spAtk:0,spDef:0}});
    gameState='overworld';const m=MAPS[P.mapId];if(m&&m.music)SFX.bgm(m.music)},

  // Drawing...continued in next part
};

function startWild(){if(!P.party.length||P.party.every(c=>c.hp<=0))return;
  const map=MAPS[P.mapId],pos=map.enc||[],cid=pos[Math.floor(Math.random()*pos.length)];
  const maxLv=Math.max(...P.party.map(c=>c.level));
  const lv=Math.max(2,Math.floor(maxLv*(.6+Math.random()*.6)));
  EncTrans.start(()=>{B.startWild(makeCreature(cid,lv))})}

function startTrainer(npc){
  const creatures=npc.battle.creatures.map(c=>makeCreature(c.id,c.lv||5));
  EncTrans.start(()=>{B.startTrainer(creatures,npc.name,npc.gym||null,npc.champion||false)})}

// === BATTLE DRAWING ===
B.draw=function(){
  drawBattleBG();
  // Platforms
  X.fillStyle='#6b8f45';X.beginPath();X.ellipse(580+this.slideE,200,120,30,0,0,Math.PI*2);X.fill();
  X.fillStyle='#7a9f55';X.beginPath();X.ellipse(580+this.slideE,198,100,22,0,0,Math.PI*2);X.fill();
  X.fillStyle='#7a9f55';X.beginPath();X.ellipse(200+this.slideP,380,130,35,0,0,Math.PI*2);X.fill();
  X.fillStyle='#8aaf65';X.beginPath();X.ellipse(200+this.slideP,378,110,28,0,0,Math.PI*2);X.fill();
  // Enemy sprite
  if(this.enemy){let ex=530+this.slideE,ey=105;
    if(this.shakeT>0&&this.shakeTgt==='enemy')ex+=Math.sin(this.shakeT*2)*8;
    if(this.flashT>0&&this.flashTgt==='enemy'&&Math.floor(this.flashT/3)%2===0)X.globalAlpha=.3;
    SP.draw(this.enemy.sprite,ex,ey,96,96);X.globalAlpha=1}
  // Player sprite
  const p=P.party[0];
  if(p){let px=150+this.slideP,py=240;
    if(this.shakeT>0&&this.shakeTgt==='player')px+=Math.sin(this.shakeT*2)*8;
    if(this.flashT>0&&this.flashTgt==='player'&&Math.floor(this.flashT/3)%2===0)X.globalAlpha=.3;
    SP.draw(p.sprite,px,py,112,112);X.globalAlpha=1}
  Particles.draw();
  // Info panels
  if(this.enemy)this.drawInfo(this.enemy,30,30,this.hpAE,false);
  if(p)this.drawInfo(p,W-290,320,this.hpAP,true);
  this.drawMenu();
};

B.drawInfo=function(c,x,y,hpR,xp){
  X.fillStyle='rgba(10,10,30,.9)';roundRect(x,y,250,xp?95:78,10);X.fill();
  X.strokeStyle='#e2b340';X.lineWidth=2;roundRect(x,y,250,xp?95:78,10);X.stroke();
  X.fillStyle='#f0c040';X.font='bold 15px monospace';X.textAlign='left';X.fillText(c.name,x+12,y+20);
  X.fillStyle='#aaa';X.font='12px monospace';X.fillText(`Lv${c.level}`,x+180,y+20);
  // Type badge
  X.fillStyle=TYPES[c.type].color;roundRect(x+12,y+26,65,14,4);X.fill();
  X.fillStyle='#fff';X.font='10px monospace';X.textAlign='center';X.fillText(TYPES[c.type].name,x+44,y+37);
  // Status
  if(c.status){const sc={'burn':'#f44','poison':'#a4f','freeze':'#4af','sleep':'#aaa','paralyze':'#ff0','confuse':'#f4a'};
    X.fillStyle=sc[c.status]||'#fff';roundRect(x+82,y+26,45,14,4);X.fill();
    X.fillStyle='#000';X.font='bold 9px monospace';X.fillText(c.status.toUpperCase().slice(0,3),x+104,y+37)}
  X.textAlign='left';
  // HP bar
  const bx=x+12,by=y+46,bw=226,bh=14;
  X.fillStyle='#333';roundRect(bx,by,bw,bh,4);X.fill();
  const pct=Math.max(0,Math.min(1,hpR));
  if(pct>0){X.fillStyle=pct>.5?'#4caf50':pct>.25?'#ff9800':'#f44336';roundRect(bx,by,bw*pct,bh,4);X.fill();
    X.fillStyle='rgba(255,255,255,.15)';X.fillRect(bx+2,by+2,bw*pct-4,bh/2-2)}
  X.fillStyle='#ddd';X.font='11px monospace';X.textAlign='right';
  X.fillText(`${Math.max(0,c.hp)}/${c.maxHp}`,x+238,y+58);X.textAlign='left';
  if(xp){X.fillStyle='#222';X.fillRect(bx,by+20,bw,6);X.fillStyle='#2196f3';X.fillRect(bx,by+20,bw*(c.xp/c.xpNext),6);
    X.fillStyle='#888';X.font='9px monospace';X.textAlign='right';X.fillText(`XP:${c.xp}/${c.xpNext}`,x+238,by+36);X.textAlign='left'}
};

B.drawMenu=function(){
  X.fillStyle='rgba(10,10,30,.95)';X.fillRect(0,H-150,W,150);
  X.strokeStyle='#e2b340';X.lineWidth=3;X.beginPath();X.moveTo(0,H-150);X.lineTo(W,H-150);X.stroke();
  if(gameState==='battleText'){X.fillStyle='#eee';X.font='16px monospace';X.textAlign='left';
    wrapText(this.curText,30,H-115,W-60,24);
    if(!this.typing){X.fillStyle=`rgba(255,255,255,${.5+Math.sin(frame*.1)*.5})`;X.font='14px monospace';X.textAlign='right';X.fillText('▼',W-30,H-15)}
    return}
  if(this.menuState==='main'){
    X.fillStyle='#eee';X.font='16px monospace';X.textAlign='left';X.fillText('What will',30,H-110);

    btns.forEach(b=>{X.fillStyle=b.c;roundRect(b.x,b.y,140,48,8);X.fill();
      X.strokeStyle='rgba(255,255,255,.2)';X.lineWidth=2;roundRect(b.x,b.y,140,48,8);X.stroke();
      X.fillStyle='rgba(255,255,255,.08)';X.fillRect(b.x+4,b.y+4,132,20);
      X.fillStyle='#fff';X.font='bold 16px monospace';X.textAlign='center';X.fillText(b.l,b.x+70,b.y+30)})
  }else if(this.menuState==='moves'){

      X.fillStyle=(TYPES[m.type]?TYPES[m.type].color:'#555')+'33';roundRect(mx,my,200,45,8);X.fill();
      X.strokeStyle=TYPES[m.type]?TYPES[m.type].color:'#555';X.lineWidth=2;roundRect(mx,my,200,45,8);X.stroke();
      X.fillStyle='#eee';X.font='14px monospace';X.textAlign='left';X.fillText(m.name,mx+10,my+18);
      X.fillStyle=TYPES[m.type]?TYPES[m.type].color:'#888';X.font='11px monospace';
      X.fillText(`${TYPES[m.type]?.name||'?'} ${m.cat==='special'?'Sp':'Ph'} Pow:${m.pow||'-'}`,mx+10,my+34);
      X.fillStyle='#888';X.textAlign='right';X.fillText(`PP:${m.curPP}/${m.pp}`,mx+190,my+34)});
    X.fillStyle='#444';roundRect(500,H-80,120,40,8);X.fill();
    X.fillStyle='#eee';X.font='14px monospace';X.textAlign='center';X.fillText('← BACK',560,H-55)
  }else if(this.menuState==='bag'){
    const items=P.bag.filter(i=>i.count>0);
    items.forEach((item,i)=>{const iy=H-140+i*28;
      X.fillStyle=i%2?'rgba(0,0,0,.1)':'rgba(255,255,255,.05)';X.fillRect(30,iy,W-60,26);
      X.fillStyle='#eee';X.font='14px monospace';X.textAlign='left';X.fillText(item.name,50,iy+18);
      X.fillStyle='#888';X.textAlign='right';X.fillText(`x${item.count}`,W-50,iy+18)});
    X.fillStyle='#444';roundRect(W-160,H-30,120,25,6);X.fill();
    X.fillStyle='#eee';X.font='12px monospace';X.textAlign='center';X.fillText('← BACK',W-100,H-13)
  }else if(this.menuState==='team'){
    P.party.forEach((c,i)=>{const cy=H-140+i*24;const pct=Math.max(0,c.hp/c.maxHp);
      X.fillStyle=i===0?'rgba(255,255,100,.1)':'rgba(255,255,255,.03)';X.fillRect(30,cy,W-60,22);
      X.fillStyle=c.hp>0?'#eee':'#666';X.font='13px monospace';X.textAlign='left';
      X.fillText(`${c.name} Lv${c.level}`,50,cy+16);

B.click=function(mx,my){
  if(gameState==='battleText'){this.advText();return}
  if(!this.turn)return;
  if(this.menuState==='main'){
    if(mx>W/2+10&&mx<W/2+150&&my>H-130&&my<H-82){SFX.j('sel');this.menuState='moves'}
    else if(mx>W/2+170&&mx<W/2+310&&my>H-130&&my<H-82){SFX.j('sel');this.menuState='bag'}
    else if(mx>W/2+10&&mx<W/2+150&&my>H-70&&my<H-22){SFX.j('sel');this.menuState='team'}
    else if(mx>W/2+170&&mx<W/2+310&&my>H-70&&my<H-22)this.tryRun()
  }else if(this.menuState==='moves'){
    const p=P.party[0];if(!p)return;
    for(let i=0;i<p.moves.length;i++){const bx=(i%2)*220+30,by=H-135+Math.floor(i/2)*55;
      if(mx>bx&&mx<bx+200&&my>by&&my<by+45){this.useMove(i);return}}
    if(mx>500&&mx<620&&my>H-80&&my<H-40)this.menuState='main'
  }else if(this.menuState==='bag'){
    const items=P.bag.filter(i=>i.count>0);
    for(let i=0;i<items.length;i++){const iy=H-140+i*28;if(mx>30&&mx<W-30&&my>iy&&my<iy+26){this.useItem(items[i]);return}}
    if(mx>W-160&&mx<W-40&&my>H-30&&my<H-5)this.menuState='main'
  }else if(this.menuState==='team'){
    for(let i=0;i<P.party.length;i++){const cy=H-140+i*24;if(mx>30&&mx<W-30&&my>cy&&my<cy+22){this.switchTo(i);return}}
    if(mx>W-160&&mx<W-40&&my>H-30&&my<H-5)this.menuState='main'}
};

const TPAL={[T.G]:'#3a7d44',[T.P]:'#c4a35a',[T.TG]:'#2d6b35',[T.TR]:'#1a4d2e',[T.W]:'#2563a8',
  [T.BL]:'#6d5c4e',[T.DR]:'#8b4513',[T.SN]:'#c4a35a',[T.FL]:'#3a7d44',[T.FN]:'#8b7355',

function drawOverworld(){
  const map=MAPS[P.mapId];if(!map)return;
  const cx=Math.max(0,Math.min(P.px-W/2+TS/2,map.w*TS-W));
  const cy=Math.max(0,Math.min(P.py-H/2+TS/2,map.h*TS-H));
  const sx=Math.floor(cx/TS),sy=Math.floor(cy/TS);
  const ex=Math.min(map.w-1,sx+Math.ceil(W/TS)+1);
  const ey=Math.min(map.h-1,sy+Math.ceil(H/TS)+1);
  for(let y=sy;y<=ey;y++)for(let x=sx;x<=ex;x++)drawTile(map.data[y][x],x*TS-cx,y*TS-cy,x,y);
  // NPCs
  for(const npc of(map.npcs||[])){const nx=npc.x*TS-cx,ny=npc.y*TS-cy;
    if(nx>-TS&&nx<W+TS&&ny>-TS&&ny<H+TS){
      X.fillStyle='rgba(0,0,0,.2)';X.beginPath();X.ellipse(nx+TS/2,ny+TS-3,10,3,0,0,Math.PI*2);X.fill();
      SP.draw(npc.sp,nx+2,ny+2,TS-4,TS-4);
      // Exclamation if has battle
      if(npc.battle&&!P.defeated.includes(npc.name)){X.fillStyle='#f44';X.font='bold 14px monospace';X.textAlign='center';X.fillText('!',nx+16,ny-4)}}}
  // Player
  const ppx=P.px-cx,ppy=P.py-cy;
  X.fillStyle='rgba(0,0,0,.25)';X.beginPath();X.ellipse(ppx+TS/2,ppy+TS-2,10,4,0,0,Math.PI*2);X.fill();
  const dirs={down:'d',up:'u',left:'l',right:'r'};
  SP.draw(`p_${dirs[P.dir]}${P.walkFrame}`,ppx+2,ppy,TS-4,TS);
  // Tall grass overlay
  if(map.data[P.y]&&map.data[P.y][P.x]===T.TG){const ox=P.x*TS-cx,oy=P.y*TS-cy;
    X.fillStyle='rgba(30,84,40,.6)';for(let i=0;i<3;i++){const gx=ox+5+i*9,sw=Math.sin(frame*.04+P.x+P.y+i)*2;X.fillRect(gx+sw,oy+16,3,16)}}
  drawHUD(map,cx,cy);
}

function drawTile(tile,sx,sy,tx,ty){

    case T.G:X.fillStyle='#3e8348';if((tx+ty)%3===0)X.fillRect(sx+8,sy+12,2,8);if((tx+ty)%5===1)X.fillRect(sx+20,sy+6,2,10);break;
    case T.TG:X.fillStyle='#1e5428';for(let i=0;i<4;i++){const gx=sx+3+i*7,sw=Math.sin(frame*.04+tx+ty+i)*2;X.fillRect(gx+sw,sy+4,2,24);X.fillRect(gx+sw-3,sy+2,8,4)}X.fillStyle='#25632f';X.fillRect(sx+2+Math.sin(frame*.05+tx),sy+10,3,16);break;
    case T.TR:X.fillStyle='#5d3a1a';X.fillRect(sx+12,sy+18,8,14);X.fillStyle='#1a5c2e';X.beginPath();X.arc(sx+16,sy+12,13,0,Math.PI*2);X.fill();X.fillStyle='#1a6e32';X.beginPath();X.arc(sx+14,sy+9,9,0,Math.PI*2);X.fill();X.fillStyle='#22803a';X.beginPath();X.arc(sx+18,sy+8,7,0,Math.PI*2);X.fill();break;
    case T.W:X.fillStyle='#1d5faa';const wo=Math.sin(frame*.025+tx*.5+ty*.3)*3;X.fillRect(sx,sy+12+wo,TS,4);X.fillStyle='#3a9fd8';X.fillRect(sx+4,sy+5+wo,12,2);X.fillRect(sx+18,sy+20+wo,8,2);break;
    case T.BL:X.fillStyle='#5a4a3e';X.fillRect(sx+1,sy+1,30,30);X.fillStyle='#4a3828';X.fillRect(sx,sy,TS,5);X.fillStyle='#756050';X.fillRect(sx,sy+28,TS,4);X.fillStyle='#ffd700';X.fillRect(sx+8,sy+10,14,10);X.fillStyle='#fff8dc';X.fillRect(sx+10,sy+12,10,6);X.fillStyle='#4a3828';X.fillRect(sx+14,sy+10,2,10);X.fillRect(sx+8,sy+14,14,2);break;
    case T.DR:X.fillStyle='#5a4a3e';X.fillRect(sx+1,sy+1,30,30);X.fillStyle='#8b4513';X.fillRect(sx+8,sy+2,16,30);X.fillStyle='#a0522d';X.fillRect(sx+10,sy+4,12,26);X.fillStyle='#ffd700';X.beginPath();X.arc(sx+19,sy+18,2,0,Math.PI*2);X.fill();break;
    case T.HL:X.fillStyle='#cc4444';X.fillRect(sx+2,sy+2,28,28);X.fillStyle='#ff6b6b';X.fillRect(sx+4,sy+4,24,24);X.fillStyle='#fff';X.fillRect(sx+12,sy+6,8,20);X.fillRect(sx+6,sy+12,20,8);X.fillStyle=`rgba(255,100,100,${.2+Math.sin(frame*.08)*.15})`;X.beginPath();X.arc(sx+16,sy+16,18,0,Math.PI*2);X.fill();break;
    case T.FN:X.fillStyle='#6d5c4e';X.fillRect(sx+2,sy+10,28,4);X.fillRect(sx+2,sy+20,28,4);X.fillStyle='#8b7355';X.fillRect(sx+4,sy+5,4,24);X.fillRect(sx+24,sy+5,4,24);break;
    case T.SN:X.fillStyle='#c4a35a';X.fillRect(sx,sy,TS,TS);X.fillStyle='#8b7355';X.fillRect(sx+12,sy+18,8,14);X.fillStyle='#deb887';X.fillRect(sx+4,sy+4,24,16);X.fillStyle='#5a3e28';X.fillRect(sx+7,sy+8,18,2);X.fillRect(sx+7,sy+14,14,2);
      if(Math.abs(P.x-tx)<=1&&Math.abs(P.y-ty)<=1){X.fillStyle='#f0c040';X.font='bold 12px monospace';X.textAlign='center';X.fillText('!',sx+16,sy-2)}break;
    case T.FL:X.fillStyle='#3a7d44';X.fillRect(sx,sy,TS,TS);const fc=['#ff69b4','#ff6347','#ffd700','#da70d6','#87ceeb'];

    case T.P:X.fillStyle='#b89a4a';if((tx+ty)%4===0)X.fillRect(sx+4,sy+4,4,4);if((tx+ty)%6===2)X.fillRect(sx+20,sy+20,5,5);if((tx+ty)%5===3)X.fillRect(sx+14,sy+8,3,3);break;

function drawHUD(map,cx,cy){
  X.fillStyle='rgba(0,0,0,.7)';roundRect(8,8,220,24+P.party.length*18,8);X.fill();

  if(P.badges.length){X.fillStyle='#aaa';X.font='10px monospace';X.fillText(`Badges: ${P.badges.length}`,140,25)}

    X.fillText(`${c.name} ${c.level}`,18,cy);

    if(c.status){X.fillStyle='#f88';X.font='8px monospace';X.fillText(c.status.slice(0,3).toUpperCase(),bx+bw+3,cy)}});
  // Money
  X.fillStyle='rgba(0,0,0,.6)';roundRect(8,38+P.party.length*18,80,18,4);X.fill();
  X.fillStyle='#ffd700';X.font='11px monospace';X.textAlign='left';X.fillText(`$${P.money}`,15,52+P.party.length*18);
  // Minimap
  const mw=100,mh=80,mx=W-mw-10,my=10;
  X.fillStyle='rgba(0,0,0,.7)';roundRect(mx-4,my-4,mw+8,mh+8,6);X.fill();
  const scx=mw/map.w,scy=mh/map.h;
  for(let y=0;y<map.h;y++)for(let x=0;x<map.w;x++){X.fillStyle=TPAL[map.data[y][x]]||'#3a7d44';X.fillRect(mx+x*scx,my+y*scy,Math.ceil(scx),Math.ceil(scy))}
  X.fillStyle='#ff0';X.fillRect(mx+P.x*scx-1,my+P.y*scy-1,3,3);
  X.fillStyle='#f0c040';for(const n of(map.npcs||[]))X.fillRect(mx+n.x*scx,my+n.y*scy,2,2);
}

      const items=P.bag.filter(i=>i.count>0);
      for(let i=0;i<items.length;i++){const iy=85+i*50;
        if(mx>W-180&&mx<W-120&&my>iy+8&&my<iy+34){const item=items[i];
          if(item.fx==='heal'){const c=P.party.find(p=>p.hp<p.maxHp&&p.hp>0);if(c){c.hp=Math.min(c.maxHp,c.hp+item.val);item.count--;SFX.j('heal');Notif.show(`${c.name} healed!`)}}
          else if(item.fx==='revive'){const f=P.party.find(c=>c.hp<=0);if(f){f.hp=Math.floor(f.maxHp/2);item.count--;SFX.j('heal');Notif.show(`${f.name} revived!`)}}
          return}}return}
    if(this.screen==='lexicon'){if(mx>60&&mx<160&&my>H-65&&my<H-35)this.screen=null;return}
    const btns=[{y:H/2-100},{y:H/2-50},{y:H/2},{y:H/2+50},{y:H/2+100}];
    for(let i=0;i<btns.length;i++){if(mx>W/2-100&&mx<W/2+100&&my>btns[i].y&&my<btns[i].y+40){
      SFX.j('sel');if(i===0)this.screen='party';else if(i===1)this.screen='bag';else if(i===2)this.screen='lexicon';else if(i===3)this.save();else this.close();return}}}
};

// === TITLE SCREEN ===
function drawTitle(){
  const grad=X.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#1a0a2e');grad.addColorStop(.5,'#16213e');grad.addColorStop(1,'#0f3460');
  X.fillStyle=grad;X.fillRect(0,0,W,H);
  for(let i=0;i<50;i++){const sx=(i*137+frame*.2)%W,sy=(i*73)%300;
    X.fillStyle=`rgba(255,255,255,${.3+Math.sin(frame*.02+i)*.3})`;X.fillRect(sx,sy,2,2)}
  X.save();X.font='bold 52px monospace';X.textAlign='center';
  X.fillStyle='#a06000';X.fillText('LEXICON LEGENDS',W/2+3,183);
  X.fillStyle='#f0c040';X.fillText('LEXICON LEGENDS',W/2,180);
  X.shadowColor='#f0c040';X.shadowBlur=20;X.fillText('LEXICON LEGENDS',W/2,180);X.restore();
  X.fillStyle='#88aacc';X.font='18px monospace';X.textAlign='center';X.fillText('A Literary Creature RPG',W/2,220);
  ['cr_metaphor','cr_simile','cr_hyperbole'].forEach((s,i)=>{SP.draw(s,168+i*200,290+Math.sin(frame*.03+i*2)*15,64,64)});
  if(Math.sin(frame*.06)>0){X.fillStyle='#f0c040';X.font='20px monospace';X.textAlign='center';X.fillText('CLICK TO START',W/2,440)}
  X.fillStyle='#556';X.font='12px monospace';X.textAlign='center';
  X.fillText('Arrow Keys/WASD: Move | SPACE: Interact | M: Menu',W/2,520);
  X.fillText('Click buttons in battle | All in your browser!',W/2,540);
}

// === STARTER SELECT ===
let starterHover=-1;
function drawStarterSelect(){
  const grad=X.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#1a0a2e');grad.addColorStop(1,'#0f3460');
  X.fillStyle=grad;X.fillRect(0,0,W,H);
  X.fillStyle='#f0c040';X.font='bold 28px monospace';X.textAlign='center';X.fillText('Choose Your Starter!',W/2,55);
  const starters=[
    {id:'metaphor',x:80,desc:'Rhetoric Type\nHigh Sp.Atk\nShapeshifter'},
    {id:'simile',x:300,desc:'Poetic Type\nBalanced\nVersatile'},
    {id:'hyperbole',x:520,desc:'Dramatic Type\nGlass Cannon\nTHE STRONGEST'}];
  starters.forEach((s,i)=>{const d=CREATURES[s.id],hov=starterHover===i,y=80;
    X.fillStyle=hov?'rgba(240,192,64,.15)':'rgba(255,255,255,.05)';roundRect(s.x,y,200,420,12);X.fill();
    X.strokeStyle=hov?'#f0c040':TYPES[d.type].color;X.lineWidth=hov?3:2;roundRect(s.x,y,200,420,12);X.stroke();
    SP.draw(d.sprite,s.x+52,y+30,96,96);
    X.fillStyle='#f0c040';X.font='bold 18px monospace';X.textAlign='center';X.fillText(d.name,s.x+100,y+150);
    X.fillStyle=TYPES[d.type].color;X.font='14px monospace';X.fillText(TYPES[d.type].name,s.x+100,y+175);
    X.fillStyle='#aaa';X.font='12px monospace';
    X.fillText(`HP:${d.base.hp} ATK:${d.base.atk} DEF:${d.base.def}`,s.x+100,y+200);
    X.fillText(`SPD:${d.base.spd} SpA:${d.base.spAtk}`,s.x+100,y+218);
    X.fillStyle='#888';X.font='11px monospace';s.desc.split('\n').forEach((l,li)=>X.fillText(l,s.x+100,y+250+li*16));
    X.fillStyle='#666';X.font='10px monospace';wrapText(d.desc,s.x+15,y+320,170,14)})
}

function clickStarter(mx,my){
  const ids=['metaphor','simile','hyperbole'],xs=[80,300,520];
  for(let i=0;i<3;i++){if(mx>xs[i]&&mx<xs[i]+200&&my>80&&my<500){
    SFX.j('sel');const c=makeCreature(ids[i],5);P.party.push(c);P.starterChoice=ids[i];
    P.rivalStarter=RIVAL.getStarter(ids[i]);
    gameState='dialogue';
    Dlg.start([
      {s:'Prof. Narrator',t:`Excellent! ${c.name} will serve you well!`},
      {s:'Prof. Narrator',t:'Explore tall grass to find creatures, battle trainers, and grow stronger!'},
      {s:'Prof. Narrator',t:'Beat the 3 Gym Leaders to earn badges, then challenge the Champion!'},
      {s:'Quinn',t:`Hey! I\'m Quinn, your rival. I picked ${CREATURES[P.rivalStarter].name}!`},
      {s:'Quinn',t:'I\'ll be the greatest Lexicographer, not you! See you around!'},
      {s:'Prof. Narrator',t:'Head east to Route 1. Press M for menu. Good luck!'},
    ]);SFX.bgm('town');return}}}

// === CLICK HANDLER ===
C.addEventListener('click',e=>{
  const r=C.getBoundingClientRect(),sx=W/r.width,sy=H/r.height;
  const mx=(e.clientX-r.left)*sx,my=(e.clientY-r.top)*sy;
  if(gameState==='title'){SFX.init();gameState='starterSelect';SFX.j('start');
    // Check save
    try{const s=JSON.parse(localStorage.getItem('lex_save'));
      if(s&&s.party&&s.party.length>0){
        P.x=s.p.x;P.y=s.p.y;P.px=P.x*TS;P.py=P.y*TS;P.mapId=s.p.mapId;P.bag=s.p.bag;
        P.defeated=s.p.defeated||[];P.money=s.p.money||500;P.badges=s.p.badges||[];
        P.lexLog=new Set(s.p.lexLog||[]);P.rivalStarter=s.p.rivalStarter;P.starterChoice=s.p.starterChoice;
        P.party=s.party.map(c=>{const cr=makeCreature(c.id,c.level);cr.hp=c.hp;cr.xp=c.xp;cr.status=c.status;cr.statusTurns=c.statusTurns;
          cr.moves=c.moves.map(m=>{const d=MOVES[m.id];return{...d,id:m.id,curPP:m.curPP}});return cr});
        gameState='overworld';const m=MAPS[P.mapId];if(m&&m.music)SFX.bgm(m.music);Notif.show('Save loaded!');return}}catch(e){}}
  else if(gameState==='starterSelect')clickStarter(mx,my);
  else if(gameState==='dialogue')Dlg.advance();
  else if(gameState==='battleText')B.advText();
  else if(gameState==='battle')B.click(mx,my);
  else if(gameState==='menu')GM.click(mx,my);
  else if(gameState==='shop')Shop.click(mx,my);
});
C.addEventListener('mousemove',e=>{
  const r=C.getBoundingClientRect(),mx=(e.clientX-r.left)*(W/r.width),my=(e.clientY-r.top)*(H/r.height);
  if(gameState==='starterSelect'){starterHover=-1;[80,300,520].forEach((x,i)=>{if(mx>x&&mx<x+200&&my>80&&my<500)starterHover=i})}
});

// === KEYBOARD ===
document.addEventListener('keydown',e=>{
  if(!keys[e.code])kj[e.code]=1;keys[e.code]=1;
  if(gameState==='overworld'){if(e.code==='KeyM')GM.toggle();if(e.code==='Space'||e.code==='Enter')interact()}
  if(gameState==='dialogue'&&(e.code==='Space'||e.code==='Enter'||e.code==='KeyZ'))Dlg.advance();
  if(gameState==='menu'&&(e.code==='Escape'||e.code==='KeyM'))GM.close();
  if(gameState==='shop'&&e.code==='Escape')Shop.close();
  e.preventDefault();
});

// === GAME LOOP ===
function gameLoop(){
  requestAnimationFrame(gameLoop);frame++;kj={};
  if(gameState==='overworld')updatePlayer();
  Trans.update();EncTrans.update();Notif.update();
  if(gameState==='dialogue')Dlg.update();
  if(gameState==='battle'||gameState==='battleText')B.update();
  X.fillStyle='#000';X.fillRect(0,0,W,H);
  if(gameState==='title')drawTitle();
  else if(gameState==='starterSelect')drawStarterSelect();
  else if(gameState==='overworld'||gameState==='dialogue'||gameState==='menu'||gameState==='shop'){
    drawOverworld();if(gameState==='dialogue')Dlg.draw();if(gameState==='menu')GM.draw();if(gameState==='shop')Shop.draw()}
  else if(gameState==='battle'||gameState==='battleText')B.draw();
  Particles.draw();Trans.draw();EncTrans.draw();Notif.draw();
}
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
