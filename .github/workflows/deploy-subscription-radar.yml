name: Deploy Subscription Radar to GitHub Pages

# Manual trigger only until GitHub Pages is available for this repo
# (private repos need a paid plan, or make the repo public). Once Pages is
# enabled, run this from the Actions tab — or restore the push trigger.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        working-directory: projects/subscription-radar
        run: |
          npm ci
          npm test
          npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: projects/subscription-radar/dist
      - id: deployment
        uses: actions/deploy-pages@v4
