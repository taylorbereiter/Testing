name: Deploy Subscription Radar to GitHub Pages

# Deploys by pushing the built site to the gh-pages branch (GitHub Pages
# source). The artifact-based deploy (actions/deploy-pages) is not usable
# here: the workflow token can't switch the Pages source to "GitHub Actions".
on:
  push:
    branches: [main, claude/iphone-app-cloud-deploy-t9bw45]
    paths:
      - "projects/subscription-radar/**"
      - ".github/workflows/deploy-subscription-radar.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        working-directory: projects/subscription-radar
        run: |
          npm ci
          npm test
          npm run build
          touch dist/.nojekyll
      - name: Push to gh-pages
        working-directory: projects/subscription-radar/dist
        run: |
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Subscription Radar from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
